        `;
      }

      else if (currentTab === 'stats') {
        const statsBooks = await getCachedBooks();
        const statsMedia = await getCachedMediaItems();
        const statsReadingLogs = await dbGetAll('reading_logs');
        const statsMediaLogs = await dbGetAll('media_logs');

        const currentYear = String(new Date().getFullYear());
        const MONTH_NAMES = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

        const booksCompletedThisYear = statsBooks.filter(b => b.status === 'COMPLETED' && b.endDate && b.endDate.startsWith(currentYear));
        const mediaCompletedThisYear = statsMedia.filter(m => m.status === 'COMPLETED' && m.endDate && m.endDate.startsWith(currentYear));

        // Streak: giorni consecutivi (da oggi a ritroso) con almeno un log di lettura o visione registrato
        const activityDatesSet = new Set([...statsReadingLogs.map(l => l.date), ...statsMediaLogs.map(l => l.date)]);
        let streak = 0;
        let streakCursor = new Date();
        while (activityDatesSet.has(getLocalDateString(streakCursor))) {
          streak++;
          streakCursor.setDate(streakCursor.getDate() - 1);
        }

        // Generi più frequenti (conteggio su libri + media, tutti quelli con generi assegnati) — top 3
        const genreCounts = {};
        [...statsBooks, ...statsMedia].forEach(item => {
          (item.genres || []).forEach(g => { genreCounts[g] = (genreCounts[g] || 0) + 1; });
        });
        const topGenres = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);
        const maxGenreCount = Math.max(1, ...Object.values(genreCounts));

        // Valutazione media (libri + media con valutazione impostata)
        const allRatings = [...statsBooks, ...statsMedia].map(item => item.rating || 0).filter(r => r > 0);
        const avgRating = allRatings.length > 0 ? (allRatings.reduce((a, b) => a + b, 0) / allRatings.length) : 0;

        // Obiettivo annuale di lettura
        const readingGoal = appSettings.readingGoal || 1;
        const goalPercent = Math.min(100, Math.round((booksCompletedThisYear.length / readingGoal) * 100));

        // Confronto mese corrente vs mese precedente: tre verifiche distinte, tutte sui libri,
        // senza mai sommare tra loro grandezze diverse (pagine, libri completati, libri aggiunti
        // al catalogo sono tre unità di misura diverse e vanno confrontate separatamente).
        const nowForMonths = new Date();
        const thisMonthKey = getLocalDateString(nowForMonths).substring(0, 7);
        const prevMonthDateObj = new Date(nowForMonths.getFullYear(), nowForMonths.getMonth() - 1, 1);
        const prevMonthKey = getLocalDateString(prevMonthDateObj).substring(0, 7);
        const thisMonthLabel = MONTH_NAMES[nowForMonths.getMonth()];
        const prevMonthLabel = MONTH_NAMES[prevMonthDateObj.getMonth()];

        // Verifica 1: pagine lette (Fisico/E-book) e minuti ascoltati (Audio-libro) per mese
        function readingVolumeForMonth(monthKey) {
          let pages = 0, minutes = 0;
          statsReadingLogs.forEach(l => {
            if (!l.date || !l.date.startsWith(monthKey)) return;
            const book = statsBooks.find(b => b.id === l.bookId);
            if (!book) return;
            if (book.format === 'Audio-libro') minutes += (l.pagesRead || 0);
            else pages += (l.pagesRead || 0);
          });
          return { pages, minutes };
        }
        const thisMonthReading = readingVolumeForMonth(thisMonthKey);
        const prevMonthReading = readingVolumeForMonth(prevMonthKey);
        const maxPagesMonth = Math.max(1, thisMonthReading.pages, prevMonthReading.pages);
        const maxMinutesMonth = Math.max(1, thisMonthReading.minutes, prevMonthReading.minutes);

        // Verifica 2: libri completati (letti/ascoltati, qualunque formato) per mese, in base a Data Fine
        function booksCompletedInMonth(monthKey) {
          return statsBooks.filter(b => b.status === 'COMPLETED' && b.endDate && b.endDate.startsWith(monthKey)).length;
        }
        const thisMonthCompleted = booksCompletedInMonth(thisMonthKey);
        const prevMonthCompleted = booksCompletedInMonth(prevMonthKey);
        const maxCompletedMonth = Math.max(1, thisMonthCompleted, prevMonthCompleted);

        // Verifica 3: libri registrati (aggiunti al catalogo) per mese, dedotto dal timestamp
        // incorporato nell'id del libro (stesso id usato altrove nell'app per l'ordinamento "Ultimo inserimento")
        function extractTimestampFromId(id) {
          if (!id) return null;
          const ts = parseInt(String(id).split('_')[1]);
          return isNaN(ts) ? null : ts;
        }
        function booksAddedInMonth(monthKey) {
          return statsBooks.filter(b => {
            const ts = extractTimestampFromId(b.id);
            if (!ts) return false;
            return getLocalDateString(new Date(ts)).substring(0, 7) === monthKey;
          }).length;
        }
        const thisMonthAdded = booksAddedInMonth(thisMonthKey);
        const prevMonthAdded = booksAddedInMonth(prevMonthKey);
        const maxAddedMonth = Math.max(1, thisMonthAdded, prevMonthAdded);

        // Griglia attività: ultime 12 settimane, colonne = settimane, righe = giorno della settimana
        const WEEKS_TO_SHOW = 12;
        const gridDays = [];
        const gridToday = new Date();
        for (let i = (WEEKS_TO_SHOW * 7) - 1; i >= 0; i--) {
          const d = new Date(gridToday);
          d.setDate(d.getDate() - i);
          const dateStr = getLocalDateString(d);
          const count = statsReadingLogs.filter(l => l.date === dateStr).length + statsMediaLogs.filter(l => l.date === dateStr).length;
          gridDays.push({ date: dateStr, count });
        }
        const gridColumns = [];
        for (let w = 0; w < WEEKS_TO_SHOW; w++) {
          gridColumns.push(gridDays.slice(w * 7, w * 7 + 7));
        }

        const activityColor = (count) => {
          if (count === 0) return 'bg-gray-500/10';
          if (count === 1) return 'bg-emerald-900';
          if (count === 2) return 'bg-emerald-700';
          if (count <= 4) return 'bg-emerald-500';
          return 'bg-emerald-400';
        };

        // Pagine lette nell'anno (Fisico/E-book) e ore di ascolto (Audio-libro) — stesso campo
        // "pagine avanzate" del log, interpretato diversamente in base al formato del libro.
        const readingLogsThisYear = statsReadingLogs.filter(l => l.date && l.date.startsWith(currentYear));
        let pagesReadTotal = 0;
        let audioMinutesTotal = 0;
        readingLogsThisYear.forEach(l => {
          const book = statsBooks.find(b => b.id === l.bookId);
          if (!book) return;
          if (book.format === 'Audio-libro') audioMinutesTotal += (l.pagesRead || 0);
          else pagesReadTotal += (l.pagesRead || 0);
        });
        const audioHours = Math.floor(audioMinutesTotal / 60);
        const audioMinsRemainder = audioMinutesTotal % 60;

        // Diversità del catalogo: distribuzione generi (tutti), formati libro, tipi media,
        // lunghezza libri (fasce di pagine), autori ricorrenti (più di un libro)
        const allGenreEntries = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);

        const bookFormatCounts = {};
        statsBooks.forEach(b => { const f = b.format || 'Fisico'; bookFormatCounts[f] = (bookFormatCounts[f] || 0) + 1; });
        const maxBookFormatCount = Math.max(1, ...Object.values(bookFormatCounts));

        const mediaTypeCounts = {};
        statsMedia.forEach(m => {
          const typeObj = MEDIA_TYPES.find(t => t.id === m.type) || MEDIA_TYPES[0];
          mediaTypeCounts[typeObj.label] = (mediaTypeCounts[typeObj.label] || 0) + 1;
        });
        const maxMediaTypeCount = Math.max(1, ...Object.values(mediaTypeCounts));

        const lengthBuckets = { '< 150 pag.': 0, '150-300 pag.': 0, '300-450 pag.': 0, '450-600 pag.': 0, '600+ pag.': 0 };
        statsBooks.forEach(b => {
          const p = b.totalPages || 0;
          if (p < 150) lengthBuckets['< 150 pag.']++;
          else if (p < 300) lengthBuckets['150-300 pag.']++;
          else if (p < 450) lengthBuckets['300-450 pag.']++;
          else if (p < 600) lengthBuckets['450-600 pag.']++;
          else lengthBuckets['600+ pag.']++;
        });
        const maxLengthBucket = Math.max(1, ...Object.values(lengthBuckets));

    // --- MODALE NOTE ---
    let selectedIcon = "📝";
    let editingNoteStatus = "ON_BOARD"; // stato In lavagna/Non in lavagna in editing nella modale nota
    let selectedEventIcon = "📌";

    // Converte il testo libero in HTML sicuro: esegue l'escape dei caratteri speciali
    // e trasforma ogni URL http/https in un link cliccabile che apre nel browser esterno.
    function linkifyContent(text) {
      const escaped = (text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" class="underline text-indigo-400 break-all">$1</a>');
    }

    // Modale di sola visualizzazione per una nota della Lavagna: click sulla card apre questa,
    // non la modifica diretta. Tutti i link nel testo sono cliccabili e si aprono nel browser
    // esterno all'app (target="_blank"). Il pulsante "Modifica" porta alla modale di editing vera.
    async function openNoteViewModal(noteId) {
      const notes = await dbGetAll('board_notes');
      const note = notes.find(n => n.id === noteId);
      if (!note) return;

      const books = await dbGetAll('books');
      const mediaItemsForView = await dbGetAll('media_items');
      const linkedBook = books.find(b => b.id === note.linkedBookId);
      const linkedMedia = mediaItemsForView.find(m => m.id === note.linkedMediaId);
      const currentStatus = note.noteStatus || 'ON_BOARD';

      const html = `
        <div class="flex justify-between items-center pb-2 border-b border-gray-500/20">
          <h3 class="font-bold text-base flex items-center gap-2"><span class="text-xl">${note.icon || '📝'}</span> ${note.title}</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
        </div>

        ${note.photo ? `
          <div class="-mx-5">
            <img src="${note.photo}" onclick="openImageLightbox(this.src)" class="w-full aspect-video object-cover cursor-zoom-in">
          </div>
          <p class="text-[10px] opacity-50 text-center -mt-2">${estimatePhotoSizeKB(note.photo)} KB</p>
        ` : ''}

        <div class="space-y-3 text-xs pt-3">
          <p class="whitespace-pre-line leading-relaxed">${linkifyContent(note.content)}</p>

          ${linkedBook ? `
            <div onclick="closeModal(); openBookModal('${linkedBook.id}');" class="flex items-center gap-1 text-indigo-400 font-medium cursor-pointer hover:underline">
              📖 Libro: ${linkedBook.title}
            </div>
          ` : ''}
          ${linkedMedia ? `
            <div onclick="closeModal(); openMediaModal('${linkedMedia.id}');" class="flex items-center gap-1 text-indigo-400 font-medium cursor-pointer hover:underline">
              🎬 Media: ${linkedMedia.title}
            </div>
          ` : ''}
          ${note.scheduledDate ? `
            <div class="flex items-center gap-1 text-amber-500 font-medium">
              📅 In Agenda: ${formatCustomDate(note.scheduledDate)} ${note.scheduledTime ? 'alle ' + note.scheduledTime : ''}
            </div>
          ` : ''}

          <div class="flex items-center justify-between pt-2 border-t border-gray-500/20">
            <span class="opacity-60 font-medium">Stato nota</span>
            <button onclick="setNoteStatus('${note.id}', '${currentStatus === 'ON_BOARD' ? 'OFF_BOARD' : 'ON_BOARD'}')" class="ui-btn-sec px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5">
              ${currentStatus === 'ON_BOARD' ? '📌 In lavagna' : '📦 Non in lavagna'}
            </button>
          </div>
        </div>

        <div class="flex gap-2 pt-3">
          <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Chiudi</button>
          <button onclick="closeModal(); openNoteModal('${note.id}');" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Modifica</button>
        </div>
      `;
      openModal(html);
    }

    // Cambia lo stato In lavagna/Non in lavagna di una nota. Passare a "Non in lavagna"
    // richiede sempre conferma; tornare a "In lavagna" avviene invece subito.
    function setNoteStatus(noteId, newStatus) {
      if (newStatus === 'OFF_BOARD') {
        confirmForgetNote(noteId);
      } else {
        applyNoteStatus(noteId, 'ON_BOARD');
      }
    }

    function confirmForgetNote(noteId) {
      const html = `
        <div class="text-center space-y-3">
          <span class="text-3xl">🌫️</span>
          <h3 class="font-bold text-base">Segnare questa nota come "Non in lavagna"?</h3>
          <p class="text-[11px] opacity-70">Non comparirà più tra le note "In lavagna" nella Lavagna, ma resterà consultabile passando alla vista "Non in lavagna".</p>
          <div class="flex gap-2 pt-2">
            <button onclick="openNoteViewModal('${noteId}')" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
            <button onclick="applyNoteStatus('${noteId}', 'OFF_BOARD')" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold">Conferma</button>
          </div>
        </div>
      `;
      openModal(html);
    }

    async function applyNoteStatus(noteId, newStatus) {
      const notes = await dbGetAll('board_notes');
      const note = notes.find(n => n.id === noteId);
      if (!note) return;

      note.noteStatus = newStatus;
      await dbSave('board_notes', note);
      showToast(newStatus === 'OFF_BOARD' ? "Nota spostata in 'Non in lavagna'" : "Nota spostata in 'In lavagna'");
      render();
      openNoteViewModal(noteId);
    }

    async function openNoteModal(noteId = null, presetBookId = null, presetMediaId = null) {
      const books = await dbGetAll('books');
      const mediaItems = await dbGetAll('media_items');
      let note = { title: '', content: '', icon: '📝', linkedBookId: '', linkedMediaId: '', scheduledDate: '', scheduledTime: '', noteStatus: 'ON_BOARD', photo: null };

      if (noteId) {
        const notes = await dbGetAll('board_notes');
        const found = notes.find(n => n.id === noteId);
        if (found) note = found;
      } else if (presetBookId || presetMediaId) {
        // Nuova nota avviata dalla Scheda Libro o dalla Scheda Media: precompila il collegamento,
        // data e ora correnti. Di default queste note NON compaiono in Lavagna (l'utente può
        // comunque scegliere di renderle visibili tramite il toggle nel form).
        const now = new Date();
        const currentTimeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        if (presetBookId) note.linkedBookId = presetBookId;
        if (presetMediaId) note.linkedMediaId = presetMediaId;
        note.scheduledDate = getLocalDateString();
        note.scheduledTime = currentTimeStr;
        note.noteStatus = 'OFF_BOARD';
      }
      selectedIcon = note.icon || "📝";
      editingNoteStatus = note.noteStatus || 'ON_BOARD';
      editingNotePhoto = note.photo || null;
      const hasLinkAtOpen = !!(note.linkedBookId || note.linkedMediaId);

      const html = `
        <div class="flex justify-between items-center pb-2 border-b border-gray-500/20">
          <h3 class="font-bold text-base">${noteId ? 'Modifica Nota' : 'Nuova Nota / Post-it'}</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
        </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block font-semibold mb-1">Fissa in Agenda (Opzionale)</label>

            <div>
              <label class="block font-semibold mb-1">Orario (Opzionale)</label>
              <input type="time" id="note-time" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${note.scheduledTime || ''}">
            </div>
          </div>

        <div class="flex gap-2 pt-2">
          ${noteId ? `
            <button onclick="confirmDeleteNote('${noteId}')" title="Elimina" class="bg-red-500/20 hover:bg-red-500/30 text-red-500 border border-red-500/30 w-10 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center">🗑️</button>
          ` : ''}
          <button type="button" onclick="toggleEditingNoteStatus(this)" title="${editingNoteStatus === 'ON_BOARD' ? 'In lavagna' : 'Non in lavagna'}" class="ui-btn-sec w-10 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center">${editingNoteStatus === 'ON_BOARD' ? '📌' : '📦'}</button>
          <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
          <button onclick="saveNoteFromModal('${noteId || ''}')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Salva</button>
        </div>
      `;
      openModal(html);
      updateNotePhotoPreview();
    }
    // Non salva subito: aggiorna solo lo stato in editing, applicato al click su "Salva".
    function toggleEditingNoteStatus(btn) {
      SoundFX.playTap();
      editingNoteStatus = editingNoteStatus === 'ON_BOARD' ? 'OFF_BOARD' : 'ON_BOARD';
      btn.innerHTML = editingNoteStatus === 'ON_BOARD' ? '📌' : '📦';
      btn.title = editingNoteStatus === 'ON_BOARD' ? 'In lavagna' : 'Non in lavagna';
    }

    function selectNoteIcon(emoji, btn) {
      SoundFX.playTap();
      selectedIcon = emoji;
      document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('bg-indigo-500/20', 'border-indigo-500'));
      btn.classList.add('bg-indigo-500/20', 'border-indigo-500');
    }

    async function saveNoteFromModal(existingId = null) {
      const title = document.getElementById('note-title').value.trim();
      if (!title) { showToast("Inserisci un titolo per la nota"); return; }

      const notes = await dbGetAll('board_notes');

      const linkedBookIdValue = document.getElementById('note-book').value || null;
      const linkedMediaIdValue = document.getElementById('note-media').value || null;

      const noteData = {
        id: existingId || ('note_' + Date.now()),
        title: title,
        content: document.getElementById('note-content').value.trim(),
        icon: selectedIcon,
        linkedBookId: linkedBookIdValue,
        linkedMediaId: linkedMediaIdValue,
        scheduledDate: document.getElementById('note-date').value || null,
        scheduledTime: document.getElementById('note-time').value || null,
        noteStatus: editingNoteStatus,
        photo: (linkedBookIdValue || linkedMediaIdValue) ? null : editingNotePhoto,
        order: existingId ? (notes.find(n => n.id === existingId)?.order || 0) : notes.length,
        updatedAt: new Date().toISOString()
      };

      await dbSave('board_notes', noteData);
      closeModal();
      showToast(existingId ? "Nota aggiornata!" : "Nota creata!");
      render();
    }

    function confirmDeleteNote(noteId) {
      const html = `
        <div class="text-center space-y-3">
          <span class="text-3xl">🗑️</span>
          <h3 class="font-bold text-base">Eliminare la nota?</h3>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
            <button onclick="deleteNote('${noteId}')" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold">Conferma Eliminazione</button>
          </div>
        </div>
      `;
      openModal(html);
    }

    async function deleteNote(noteId) {
      await dbDelete('board_notes', noteId);
      closeModal();
      showToast("Nota eliminata");
      render();
    }

    // --- MODALE LIBRI ---
    function updateModalCoverPreview() {
      const urlInput = document.getElementById('book-cover-url') || document.getElementById('media-cover-url');
      const previewContainer = document.getElementById('modal-cover-preview');
      const titleInput = document.getElementById('book-title') || document.getElementById('media-title');
      const authorInput = document.getElementById('book-author') || document.getElementById('media-creator');

      if (!urlInput || !previewContainer) return;

      const dummyBook = {
        title: titleInput ? titleInput.value : '',
        author: authorInput ? authorInput.value : '',
        coverUrl: urlInput.value
      };

      previewContainer.innerHTML = renderBookCoverHTML(dummyBook, 'h-40');
    }

    async function openBookModal(bookId = null) {
      let book = { 
        title: '', author: '', publisher: '', publishYear: '', isbn: '', totalPages: 300, currentPage: 0, 
        format: 'Fisico', status: 'TO_READ', wishlist: 'NONE',
        seriesName: '', seriesVol: '', rating: 0, coverUrl: '',
        genres: [], collections: [], startDate: '', endDate: '', info: '', adaptationMediaId: ''
      };

      if (bookId) {
        const books = await dbGetAll('books');
        const found = books.find(b => b.id === bookId);
        if (found) book = found;
      }

      selectedGenres = (book.genres || []).filter(g => availableGenres.includes(g));
      selectedCollections = (book.collections || []).filter(c => availableCollections.includes(c));

      const allMediaForBookModal = await dbGetAll('media_items');

      const notes = await dbGetAll('board_notes');
      const linkedNotes = notes.filter(n => n.linkedBookId === bookId);

      const readingLogs = await dbGetAll('reading_logs');
      const linkedLogs = bookId ? readingLogs.filter(l => l.bookId === bookId) : [];

      const allEventsForBookModal = await dbGetAll('calendar_events');
      const linkedEventsForBook = bookId ? allEventsForBookModal.filter(e => e.linkedBookId === bookId) : [];

      // Lista combinata per "Riflessioni & Evidenziazioni": note collegate + log di lettura registrati
      // + eventi Agenda collegati, ordinati dal più recente al più vecchio (le note usano scheduledDate
      // se presente, altrimenti l'id che incorpora il timestamp di creazione; i log e gli eventi usano
      // la loro data).
      const combinedEntries = [
        ...linkedNotes.map(n => ({ type: 'note', id: n.id, sortKey: n.scheduledDate || n.id, data: n })),
        ...linkedLogs.map(l => ({ type: 'log', id: l.id, sortKey: l.date || l.id, data: l })),
        ...linkedEventsForBook.map(e => ({ type: 'event', id: e.id, sortKey: e.date || e.id, data: e }))

      const html = `
        <div class="flex justify-between items-center pb-2 border-b border-gray-500/20">

          <!-- DATI BASE -->

            <div class="sm:col-span-2">
              <label class="block font-semibold mb-1">Titolo Libro *</label>
              <input type="text" id="book-title" oninput="updateModalCoverPreview()" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${book.title || ''}">
            </div>
            <div>
              <label class="block font-semibold mb-1">Autore</label>
              <input type="text" id="book-author" oninput="updateModalCoverPreview()" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${book.author || ''}">
            </div>
            <div>
              <label class="block font-semibold mb-1">Editore</label>
              <input type="text" id="book-publisher" placeholder="Es. Mondadori" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${book.publisher || ''}">
            </div>
            <div>
              <label class="block font-semibold mb-1">Anno di Pubblicazione</label>
              <input type="number" id="book-publish-year" placeholder="Es. 2024" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${book.publishYear || ''}">
            </div>
            <div>
              <label class="block font-semibold mb-1">Codice ISBN</label>
              <input type="text" id="book-isbn" placeholder="Es. 978-8804668237" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${book.isbn || ''}">
            </div>
            <div class="sm:col-span-2">
              <label class="block font-semibold mb-1">Formato</label>
              <select id="book-format" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none">
                <option value="Fisico" ${book.format === 'Fisico' ? 'selected' : ''}>Fisico</option>
                <option value="E-book" ${book.format === 'E-book' ? 'selected' : ''}>E-book</option>
                <option value="Audio-libro" ${book.format === 'Audio-libro' ? 'selected' : ''}>Audio-libro</option>
              </select>
            </div>
          </div>

          ${book.title ? `
            <a href="https://www.goodreads.com/search?q=${encodeURIComponent(`${book.author || ''} ${book.title}`.trim()).replace(/%20/g, '+')}" target="_blank" rel="noopener noreferrer" class="text-[10px] ui-accent-text underline inline-flex items-center gap-1">
              🔎 Cerca "${book.title}" su Goodreads
            </a>
          ` : ''}

          <!-- SERIE & CATALOGAZIONE -->
          <div class="p-3 rounded-xl bg-gray-500/10 border border-gray-500/20 grid grid-cols-3 gap-2">
            <div class="col-span-2">
              <label class="block font-semibold mb-1">Collezione / Serie</label>
              <input type="text" id="book-series-name" class="ui-input w-full p-2 rounded-lg border focus:outline-none" placeholder="Es. Dune" value="${book.seriesName || ''}">
            </div>
            <div>
              <label class="block font-semibold mb-1">N. Volume</label>
              <input type="text" id="book-series-vol" class="ui-input w-full p-2 rounded-lg border focus:outline-none" placeholder="Es. 1" value="${book.seriesVol || ''}">
            </div>
          </div>

          <!-- GENERI -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block font-semibold">Generi</label>
              <button type="button" onclick="closeModal(); switchTab('settings');" class="text-[10px] ui-accent-text underline">⚙️ Gestisci Generi</button>
            </div>
            <div class="flex flex-wrap gap-1.5 p-2 rounded-xl border border-gray-500/20 max-h-32 overflow-y-auto">
              ${availableGenres.map(g => {
                const isChecked = selectedGenres.includes(g);
                return `
                  <button type="button" onclick="toggleGenreSelection('${g}', this)" class="genre-tag px-2 py-1 rounded-lg border transition text-[11px] ${isChecked ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-500/30 opacity-70'}">${g}</button>
                `;

            </div>
          </div>

          <!-- COLLEGAMENTO A UN ADATTAMENTO MEDIA -->
          <div>
            <label class="block font-semibold mb-1">Diventato Film/Serie (Opzionale)</label>
            <select id="book-adaptation-media" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none">
              <option value="">-- Nessun adattamento collegato --</option>
              ${allMediaForBookModal.map(m => `<option value="${m.id}" ${m.id === book.adaptationMediaId ? 'selected' : ''}>${m.title}</option>`).join('')}

          <div>

              <label class="block font-semibold">Collezioni</label>

                ${availableCollections.map(c => {
                  const isChecked = selectedCollections.includes(c);
                  return `
                    <button type="button" onclick="toggleCollectionSelection('${c}', this)" class="genre-tag px-2 py-1 rounded-lg border transition text-[11px] ${isChecked ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-500/30 opacity-70'}">${c}</button>

                }).join('')}
              </div>

          </div>

          <!-- CAMPO INFO / RIASSUNTO / NOTE -->

            <textarea id="book-info" rows="3" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none focus:border-indigo-500" placeholder="Inserisci un riassunto, una trama o delle note descrittive...">${book.info || ''}</textarea>

            <div class="grid grid-cols-2 gap-2">

                <option value="3" ${book.rating === 3 ? 'selected' : ''}>★★★☆☆ (3/5)</option>
                <option value="4" ${book.rating === 4 ? 'selected' : ''}>★★★★☆ (4/5)</option>

              <div class="flex justify-between items-center">
                <h4 class="font-bold ui-accent-text">Riflessioni & Evidenziazioni (${combinedEntries.length})</h4>

                            <div class="font-bold text-emerald-500 hover:underline">📖 Lettura del ${formatCustomDate(l.date)}</div>

    function syncBookProgress(source) {
      const totalInput = document.getElementById('book-pages');
      const currentInput = document.getElementById('book-current-page');
      const percentInput = document.getElementById('book-percent-input');
      const rangeInput = document.getElementById('book-progress-range');
      const badge = document.getElementById('book-progress-badge');
      const statusSelect = document.getElementById('book-status');
      const startDateInput = document.getElementById('book-start-date');
      const endDateInput = document.getElementById('book-end-date');

      if (!totalInput || !currentInput || !percentInput || !rangeInput) return;

      let totalPages = parseInt(totalInput.value) || 1;
      if (totalPages < 1) totalPages = 1;

      let currentPage = parseInt(currentInput.value) || 0;
      let percent = parseInt(percentInput.value) || 0;

      if (source === 'pages') {
        if (currentPage < 0) currentPage = 0;
        if (currentPage > totalPages) currentPage = totalPages;
        percent = Math.min(100, Math.round((currentPage / totalPages) * 100));
        percentInput.value = percent;
        rangeInput.value = percent;
      } else if (source === 'range' || source === 'percentInput') {
        percent = parseInt(source === 'range' ? rangeInput.value : percentInput.value) || 0;
        if (percent < 0) percent = 0;
        if (percent > 100) percent = 100;
        currentPage = Math.round((percent / 100) * totalPages);
        currentInput.value = currentPage;
        if (source === 'range') percentInput.value = percent;
        if (source === 'percentInput') rangeInput.value = percent;
      }

      // Stato lettura e date automatiche: valgono per qualunque modifica del progresso
      // (Pagina Corrente, Percentuale o barra di avanzamento).
      if (statusSelect && startDateInput && endDateInput) {
        const { status, startDate, endDate } = computeReadingStateFromPercent(percent, startDateInput.value, endDateInput.value);
        statusSelect.value = status;
        startDateInput.value = startDate;
        endDateInput.value = endDate;
      }

      badge.innerText = `${percent}%`;
    }

    async function saveBookFromModal(existingId = null) {
      const title = document.getElementById('book-title').value.trim();
      if (!title) { showToast("Inserisci il titolo del libro"); return; }

      const totalPages = parseInt(document.getElementById('book-pages').value) || 100;
      const currentPage = parseInt(document.getElementById('book-current-page').value) || 0;

      let oldPage = 0;
      let oldLastReadAt = null;
      if (existingId) {
        const books = await dbGetAll('books');
        const oldBook = books.find(b => b.id === existingId);
        if (oldBook) {
          oldPage = oldBook.currentPage || 0;
          oldLastReadAt = oldBook.lastReadAt;
        }
      }

      let rawCover = document.getElementById('book-cover-url').value.trim();
      
      if (rawCover && !rawCover.startsWith('data:image/jpeg;base64')) {
        showToast("Compressione copertina in corso...");
        try {
          rawCover = await processAndCompressCover(rawCover);
        } catch (e) {
          console.warn("Utilizzo URL originale come fallback:", e);
        }
      }

      const cleanGenres = selectedGenres.filter(g => availableGenres.includes(g));

      const bookData = {
		id: existingId || ('book_' + Date.now()),
		title: title,
		author: document.getElementById('book-author').value.trim(),
		publisher: document.getElementById('book-publisher').value.trim(),
		publishYear: document.getElementById('book-publish-year').value,
		isbn: document.getElementById('book-isbn').value.trim(),
		format: document.getElementById('book-format').value,
		seriesName: document.getElementById('book-series-name').value.trim(),

		genres: selectedGenres,
		info: document.getElementById('book-info').value.trim(),
		adaptationMediaId: document.getElementById('book-adaptation-media').value || null,
		collections: selectedCollections.filter(c => availableCollections.includes(c)),
		status: document.getElementById('book-status').value,
		wishlist: document.getElementById('book-wishlist').value,
		totalPages: parseInt(document.getElementById('book-pages').value) || 0,
		currentPage: parseInt(document.getElementById('book-current-page').value) || 0,

		startDate: document.getElementById('book-start-date').value || null,
		endDate: document.getElementById('book-end-date').value || null,

		rating: parseInt(document.getElementById('book-rating').value) || 0,

      await dbSave('books', bookData);

    async function deleteBook(bookId) {
      // Pulizia a cascata: rimuove i log di lettura del libro e scollega
      // le note/eventi che lo referenziavano, per non lasciare riferimenti orfani nel DB.
      const logs = await dbGetAll('reading_logs');
      for (const log of logs) {
        if (log.bookId === bookId) await dbDelete('reading_logs', log.id);
      }

      const notes = await dbGetAll('board_notes');
      for (const note of notes) {
        if (note.linkedBookId === bookId) {
          note.linkedBookId = null;
          await dbSave('board_notes', note);
        }
      }

      const calEvents = await dbGetAll('calendar_events');
      for (const evt of calEvents) {
        if (evt.linkedBookId === bookId) {
          evt.linkedBookId = null;
          await dbSave('calendar_events', evt);
        }
      }

      await dbDelete('books', bookId);
      closeModal();
      showToast("Libro eliminato");
      render();
    }

    async function saveLogEdit(logType, logId, parentId) {
      const storeName = logType === 'reading' ? 'reading_logs' : 'media_logs';
      const parentKey = logType === 'reading' ? 'bookId' : 'mediaId';

      const newDate = document.getElementById('log-edit-date').value;
      const newAmount = parseInt(document.getElementById('log-edit-amount').value) || 0;
      const newReached = parseInt(document.getElementById('log-edit-reached').value) || 0;

      if (!newDate) { showToast("Seleziona una data valida"); return; }

      const logs = await dbGetAll(storeName);
      const currentLog = logs.find(l => l.id === logId);
      if (!currentLog) return;

      // Se esiste già un altro log per lo stesso libro/media nella data di destinazione,
      // uniscili in uno solo invece di creare un duplicato per lo stesso giorno.
      const duplicate = logs.find(l => l.id !== logId && l[parentKey] === currentLog[parentKey] && l.date === newDate);

      if (duplicate) {
        if (logType === 'reading') {
          duplicate.pagesRead = (duplicate.pagesRead || 0) + newAmount;
          duplicate.reachedPage = Math.max(duplicate.reachedPage || 0, newReached);
        } else {
          duplicate.unitsRead = (duplicate.unitsRead || 0) + newAmount;
          duplicate.reachedUnit = Math.max(duplicate.reachedUnit || 0, newReached);
        }
        await dbSave(storeName, duplicate);
        await dbDelete(storeName, logId);
        showToast("Registro unito con quello già presente in quella data");
      } else {
        currentLog.date = newDate;
        if (logType === 'reading') {
          currentLog.pagesRead = newAmount;
          currentLog.reachedPage = newReached;
        } else {
          currentLog.unitsRead = newAmount;
          currentLog.reachedUnit = newReached;
        }
        await dbSave(storeName, currentLog);
        showToast("Registro aggiornato");
      }

      render();
      if (logType === 'reading') {
        openBookModal(parentId);
      } else {
        openMediaModal(parentId);
      }
    }

          const totalInput = document.getElementById('media-total-units');

    // --- GESTIONE STAGIONI (Serie TV) ---
    // editingSeasons: [{ seasonNumber, totalEpisodes, currentEpisode }, ...]
    // Il progresso complessivo (badge %, Stato Fruizione, Date) è la SOMMA di tutte le stagioni:
    // episodi visti totali / episodi totali, come richiesto.

    function renderSeasonsUI() {
      const container = document.getElementById('tv-seasons-list');
      if (!container) return;

      container.innerHTML = editingSeasons.map((s, idx) => {
        const seasonPercent = s.totalEpisodes > 0 ? Math.min(100, Math.round((s.currentEpisode / s.totalEpisodes) * 100)) : 0;
        return `
          <div class="flex items-center gap-2 p-2 rounded-lg bg-gray-500/10 border border-gray-500/20">
            <span class="text-[10px] font-bold w-20 shrink-0">Stagione ${s.seasonNumber}</span>
            <div class="flex-1 grid grid-cols-2 gap-1.5">
              <div>
                <input type="number" min="0" value="${s.totalEpisodes}" oninput="updateSeasonField(${idx}, 'totalEpisodes', this.value)" class="ui-input w-full p-1.5 rounded-lg border text-xs font-bold" placeholder="Tot. episodi">
              </div>
              <div>
                <input type="number" min="0" value="${s.currentEpisode}" oninput="updateSeasonField(${idx}, 'currentEpisode', this.value)" class="ui-input w-full p-1.5 rounded-lg border text-xs font-bold" placeholder="Visti">
              </div>
            </div>
            <span class="text-[10px] font-bold w-9 text-right shrink-0 ui-accent-text">${seasonPercent}%</span>
            <button type="button" onclick="removeSeason(${idx})" title="Rimuovi stagione" class="text-red-400 hover:text-red-500 font-bold text-xs shrink-0 px-1">✕</button>
          </div>
        `;
      }).join('') || `<p class="text-[11px] opacity-50 italic text-center py-2">Nessuna stagione, aggiungine una.</p>`;

      updateSeasonsSummary();
    }

    function updateSeasonField(idx, field, value) {
      let v = parseInt(value);
      if (isNaN(v) || v < 0) v = 0;
      editingSeasons[idx][field] = v;
      if (editingSeasons[idx].currentEpisode > editingSeasons[idx].totalEpisodes) {
        editingSeasons[idx].currentEpisode = editingSeasons[idx].totalEpisodes;
      }
      renderSeasonsUI();
    }

    function addSeason() {
      SoundFX.playTap();
      const nextNumber = editingSeasons.length > 0 ? Math.max(...editingSeasons.map(s => s.seasonNumber)) + 1 : 1;
      editingSeasons.push({ seasonNumber: nextNumber, totalEpisodes: 10, currentEpisode: 0 });
      renderSeasonsUI();
    }

    function removeSeason(idx) {
      SoundFX.playTap();
      editingSeasons.splice(idx, 1);
      renderSeasonsUI();
    }

    // Ricalcola il totale complessivo (somma di tutte le stagioni) e applica badge %,
    // Stato Fruizione e Date automatiche con le stesse regole usate ovunque nell'app.
    function updateSeasonsSummary() {
      const totalEpisodes = editingSeasons.reduce((sum, s) => sum + (s.totalEpisodes || 0), 0);
      const currentEpisodes = editingSeasons.reduce((sum, s) => sum + (s.currentEpisode || 0), 0);
      const percent = totalEpisodes > 0 ? Math.min(100, Math.round((currentEpisodes / totalEpisodes) * 100)) : 0;

      const badge = document.getElementById('media-progress-badge');
      if (badge) badge.innerText = `${percent}%`;

      const summaryEl = document.getElementById('tv-seasons-total-summary');
      if (summaryEl) summaryEl.innerText = `${currentEpisodes}/${totalEpisodes} episodi complessivi`;

      const statusSelect = document.getElementById('media-status');
      const startDateInput = document.getElementById('media-start-date');
      const endDateInput = document.getElementById('media-end-date');
      if (statusSelect && startDateInput && endDateInput) {
        const { status, startDate, endDate } = computeMediaStateFromPercent(percent, startDateInput.value, endDateInput.value);
        statusSelect.value = status;
        startDateInput.value = startDate;
        endDateInput.value = endDate;
      }
    }

    function syncMediaProgress(source) {
      const totalInput = document.getElementById('media-total-units');
      const currentInput = document.getElementById('media-current-unit');
      const percentInput = document.getElementById('media-percent-input');
      const rangeInput = document.getElementById('media-progress-range');
      const badge = document.getElementById('media-progress-badge');
      const statusSelect = document.getElementById('media-status');
      const startDateInput = document.getElementById('media-start-date');
      const endDateInput = document.getElementById('media-end-date');

      if (!totalInput || !currentInput || !percentInput || !rangeInput) return;

      let totalUnits = parseInt(totalInput.value) || 1;
      if (totalUnits < 1) totalUnits = 1;

      let currentUnit = parseInt(currentInput.value) || 0;
      let percent = parseInt(percentInput.value) || 0;

      if (source === 'units') {
        if (currentUnit < 0) currentUnit = 0;
        if (currentUnit > totalUnits) currentUnit = totalUnits;
        percent = Math.min(100, Math.round((currentUnit / totalUnits) * 100));
        percentInput.value = percent;
        rangeInput.value = percent;
      } else if (source === 'range' || source === 'percentInput') {
        percent = parseInt(source === 'range' ? rangeInput.value : percentInput.value) || 0;
        if (percent < 0) percent = 0;
        if (percent > 100) percent = 100;
        currentUnit = Math.round((percent / 100) * totalUnits);
        currentInput.value = currentUnit;
        if (source === 'range') percentInput.value = percent;
        if (source === 'percentInput') rangeInput.value = percent;
      }

      // Stato fruizione e date automatiche: valgono per qualunque modifica del progresso
      // (Unità Completate, Percentuale o barra di avanzamento).
      if (statusSelect && startDateInput && endDateInput) {
        const { status, startDate, endDate } = computeMediaStateFromPercent(percent, startDateInput.value, endDateInput.value);
        statusSelect.value = status;
        startDateInput.value = startDate;
        endDateInput.value = endDate;
      }

      badge.innerText = `${percent}%`;
    }

    async function saveMediaFromModal(existingId = null) {
      const title = document.getElementById('media-title').value.trim();
      if (!title) { showToast("Inserisci un titolo"); return; }

      const selectedType = document.getElementById('media-type').value;

      // Per le Serie TV, Unità Totali/Completate derivano dalla somma delle stagioni configurate;
      // per tutte le altre tipologie restano i campi piatti "Unità Totali/Completate" del form.
      let newTotalUnit, newCurrentUnit, seasonsToSave;
      if (selectedType === 'TV_SHOW') {
        newTotalUnit = editingSeasons.reduce((sum, s) => sum + (s.totalEpisodes || 0), 0) || 1;
        newCurrentUnit = editingSeasons.reduce((sum, s) => sum + (s.currentEpisode || 0), 0);
        seasonsToSave = editingSeasons;
      } else {
        newTotalUnit = parseInt(document.getElementById('media-total-units').value) || 1;
        newCurrentUnit = parseInt(document.getElementById('media-current-unit').value) || 0;
        seasonsToSave = null;
      }

      let oldCurrentUnit = 0;
      let oldLastActivityAt = null;
      if (existingId) {
        const items = await dbGetAll('media_items');
        const oldItem = items.find(m => m.id === existingId);
        if (oldItem) {
          oldCurrentUnit = oldItem.currentUnit || 0;
          oldLastActivityAt = oldItem.lastActivityAt;
        }
      }

      let rawCover = document.getElementById('media-cover-url').value.trim();
      if (rawCover && !rawCover.startsWith('data:image/jpeg;base64')) {
        showToast("Compressione copertina in corso...");
        try {
          rawCover = await processAndCompressCover(rawCover);
        } catch (e) {
          console.warn("Utilizzo URL originale come fallback:", e);
        }
      }

      const articleLocationInput = document.getElementById('media-article-location');

      const mediaData = {
        id: existingId || ('media_' + Date.now()),
        title: title,
        type: selectedType,
        creator: document.getElementById('media-creator').value.trim(),
        platform: document.getElementById('media-platform').value.trim(),
        articleLocation: articleLocationInput ? articleLocationInput.value.trim() : '',
        info: document.getElementById('media-info').value.trim(),
        genres: selectedGenres.filter(g => availableGenres.includes(g)),
        collections: selectedCollections.filter(c => availableCollections.includes(c)),
        status: document.getElementById('media-status').value,
        wishlist: document.getElementById('media-wishlist').value,
        totalUnits: newTotalUnit,
        currentUnit: newCurrentUnit,
        seasons: seasonsToSave,
        rating: parseInt(document.getElementById('media-rating').value) || 0,
        coverUrl: rawCover,
        startDate: document.getElementById('media-start-date').value || null,
        endDate: document.getElementById('media-end-date').value || null,
        lastActivityAt: (newCurrentUnit !== oldCurrentUnit) ? new Date().toISOString() : oldLastActivityAt,
        updatedAt: new Date().toISOString()
      };

      await dbSave('media_items', mediaData);

      const unitsChanged = newCurrentUnit - oldCurrentUnit;
      if (unitsChanged > 0) {
        await recordMediaLog(mediaData.id, unitsChanged, newCurrentUnit);
      }

      closeModal();
      showToast(existingId ? "Elemento aggiornato!" : "Elemento aggiunto!");
      render();
    }

        <div class="text-center space-y-3">
          <span class="text-3xl">🗑️</span>
          <h3 class="font-bold text-base">Eliminare questo elemento multimediale?</h3>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
            <button onclick="deleteMedia('${mediaId}')" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold">Conferma Eliminazione</button>
          </div>
        </div>
      `;
      openModal(html);
    }

    async function deleteMedia(mediaId) {
      // Pulizia a cascata: rimuove i log di visione/ascolto del media e scollega
      // le note che lo referenziavano, per non lasciare riferimenti orfani nel DB.
      const mLogs = await dbGetAll('media_logs');
      for (const log of mLogs) {
        if (log.mediaId === mediaId) await dbDelete('media_logs', log.id);
      }

      const notesLinkedToMedia = await dbGetAll('board_notes');
      for (const note of notesLinkedToMedia) {
        if (note.linkedMediaId === mediaId) {
          note.linkedMediaId = null;
          await dbSave('board_notes', note);
        }
      }

      const booksLinkingToMedia = await dbGetAll('books');
      for (const bk of booksLinkingToMedia) {
        if (bk.adaptationMediaId === mediaId) {
          bk.adaptationMediaId = null;
          await dbSave('books', bk);
        }
      }

      const eventsLinkingToMedia = await dbGetAll('calendar_events');
      for (const evt of eventsLinkingToMedia) {
        if (evt.linkedMediaId === mediaId) {
          evt.linkedMediaId = null;
          await dbSave('calendar_events', evt);
        }
      }

      await dbDelete('media_items', mediaId);
      closeModal();
      showToast("Elemento eliminato");
      render();
    }

    // Elimina, previa conferma, una singola voce (nota o log di visione/ascolto) mostrata in
    // "Riflessioni & Evidenziazioni" nella Scheda Elemento Multimediale. Mirror di
    // confirmDeleteBookEntry/deleteBookEntry per i libri.
    function confirmDeleteMediaEntry(entryType, entryId, mediaId) {
      const isLog = entryType === 'log';
      const html = `
        <div class="text-center space-y-3">
          <span class="text-3xl">🗑️</span>
          <h3 class="font-bold text-base">${isLog ? 'Eliminare questo registro di visione/ascolto?' : 'Eliminare questa nota?'}</h3>
          <p class="text-[11px] opacity-70">${isLog ? 'Verrà rimosso dallo storico e dalla vista Giorno in Agenda.' : 'Verrà rimossa anche dalla Lavagna e, se presente, dall\'Agenda.'}</p>
          <div class="flex gap-2 pt-2">
            <button onclick="openMediaModal('${mediaId}')" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
            <button onclick="deleteMediaEntry('${entryType}', '${entryId}', '${mediaId}')" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold">Conferma Eliminazione</button>
          </div>
        </div>
      `;
      openModal(html);
    }

    async function deleteMediaEntry(entryType, entryId, mediaId) {
      if (entryType === 'log') {
        await dbDelete('media_logs', entryId);
        showToast("Registro eliminato");
      } else {
        await dbDelete('board_notes', entryId);
        showToast("Nota eliminata");
      }
      render();
      await openMediaModal(mediaId);
    }

    // --- EVENTI CALENDARIO ---
    async function openEventModal(eventId = null, presetDate = null) {
      let evt = { title: '', description: '', date: presetDate || getLocalDateString(), time: '', endTime: '', isAllDay: false, recurrence: 'NONE', recurrenceEndDate: '', linkedBookId: '', linkedMediaId: '', icon: '📌', photo: null };

      if (eventId) {
        const events = await dbGetAll('calendar_events');
        const found = events.find(e => e.id === eventId);
        if (found) evt = found;
      }
      selectedEventIcon = evt.icon || "📌";
      editingEventPhoto = evt.photo || null;

      const books = await dbGetAll('books');
      const mediaItemsForEvent = await dbGetAll('media_items');

      const html = `
        <div class="flex justify-between items-center pb-2 border-b border-gray-500/20">
          <h3 class="font-bold text-base">${eventId ? 'Modifica Evento' : 'Nuovo Evento Agenda'}</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
        </div>

        <div>
          <div id="event-photo-preview-container"></div>
          <div id="event-photo-upload-controls" class="${editingEventPhoto ? 'hidden' : ''}">
            <label class="block font-semibold mb-1 mt-2 text-xs">Foto (Opzionale)</label>
            <input type="file" accept="image/*" onchange="handleEventPhotoSelect(event)" class="ui-input w-full p-2 rounded-xl border text-xs">
          </div>
        </div>

        <div class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold mb-1">Titolo Evento *</label>
            <input type="text" id="event-title" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none focus:border-indigo-500" value="${evt.title || ''}" placeholder="Es. Sessione di Lettura, Scadenza...">
          </div>

          <div>
            <label class="block font-semibold mb-1">Descrizione / Dettagli</label>
            <textarea id="event-desc" rows="2" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none focus:border-indigo-500" placeholder="Aggiungi una nota sull'evento...">${evt.description || ''}</textarea>
          </div>

          <div>
            <label class="block font-semibold mb-1">Icona Evento</label>
            <div class="flex flex-wrap gap-1.5 text-lg max-h-28 overflow-y-auto p-1 border rounded-xl border-gray-500/20">
              ${EXTENDED_ICONS.map(emoji => `
                <button type="button" onclick="selectEventIcon('${emoji}', this)" class="icon-btn p-1.5 rounded-lg border border-gray-500/30 hover:border-indigo-500 ${emoji === selectedEventIcon ? 'bg-indigo-500/20 border-indigo-500' : ''}">${emoji}</button>
              `).join('')}
            </div>
          </div>

          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="event-allday" ${evt.isAllDay ? 'checked' : ''} onchange="onEventAllDayToggle(this)" class="rounded border-gray-500 accent-indigo-600">
            <label for="event-allday" class="font-semibold cursor-pointer">Tutto il giorno</label>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-1">Data</label>
              <input type="date" id="event-date" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${evt.date}">
            </div>
            <div>
              <label class="block font-semibold mb-1">Orario Inizio</label>
              <input type="time" id="event-time" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${evt.time || ''}" ${evt.isAllDay ? 'disabled' : ''}>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-1">Ricorrenza</label>
              <select id="event-recurrence" onchange="toggleRecurrenceEndVisibility()" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none">
                <option value="NONE" ${evt.recurrence === 'NONE' ? 'selected' : ''}>Nessuna</option>
                <option value="DAILY" ${evt.recurrence === 'DAILY' ? 'selected' : ''}>Ogni giorno</option>
                <option value="WEEKLY" ${evt.recurrence === 'WEEKLY' ? 'selected' : ''}>Ogni settimana</option>
                <option value="MONTHLY" ${evt.recurrence === 'MONTHLY' ? 'selected' : ''}>Ogni mese</option>
                <option value="YEARLY" ${evt.recurrence === 'YEARLY' ? 'selected' : ''}>Ogni anno</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-1">Orario Fine (Opzionale)</label>
              <input type="time" id="event-time-end" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${evt.endTime || ''}" ${evt.isAllDay ? 'disabled' : ''}>
            </div>
          </div>

          <div id="recurrence-end-block" class="${(evt.recurrence && evt.recurrence !== 'NONE') ? '' : 'hidden'}">
            <label class="block font-semibold mb-1">Termina il (Opzionale)</label>
            <input type="date" id="event-recurrence-end" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none" value="${evt.recurrenceEndDate || ''}">
            <p class="text-[10px] opacity-60 mt-1">Lascia vuoto per una ricorrenza senza scadenza.</p>
          </div>

          <div>
            <label class="block font-semibold mb-1">Collega ad un Libro (Opzionale)</label>
            <select id="event-book" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none">
              <option value="">-- Nessun libro --</option>
              ${books.map(b => `<option value="${b.id}" ${b.id === evt.linkedBookId ? 'selected' : ''}>${b.title}</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="block font-semibold mb-1">Collega ad un Media (Opzionale)</label>
            <select id="event-media" class="ui-input w-full p-2.5 rounded-xl border focus:outline-none">
              <option value="">-- Nessun media --</option>
              ${mediaItemsForEvent.map(m => `<option value="${m.id}" ${m.id === evt.linkedMediaId ? 'selected' : ''}>${m.title}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          ${eventId ? `
            <button onclick="confirmDeleteEvent('${eventId}')" class="bg-red-500/20 hover:bg-red-500/30 text-red-500 border border-red-500/30 px-3 py-2.5 rounded-xl text-xs font-semibold">Elimina</button>
          ` : ''}
          <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
          <button onclick="saveEventFromModal('${eventId || ''}')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Salva</button>
        </div>
      `;
      openModal(html);
      updateEventPhotoPreview();
    }

    function onEventAllDayToggle(checkbox) {
      const timeStart = document.getElementById('event-time');
      const timeEnd = document.getElementById('event-time-end');
      timeStart.disabled = checkbox.checked;
      timeEnd.disabled = checkbox.checked;
      if (checkbox.checked) {
        timeStart.value = '';
        timeEnd.value = '';
      }
    }

    function toggleRecurrenceEndVisibility() {
      const recurrenceSelect = document.getElementById('event-recurrence');
      const endBlock = document.getElementById('recurrence-end-block');
      if (!recurrenceSelect || !endBlock) return;
      if (recurrenceSelect.value === 'NONE') {
        endBlock.classList.add('hidden');
      } else {
        endBlock.classList.remove('hidden');
      }
    }

    function selectEventIcon(emoji, btn) {
      SoundFX.playTap();
      selectedEventIcon = emoji;
      document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('bg-indigo-500/20', 'border-indigo-500'));
      btn.classList.add('bg-indigo-500/20', 'border-indigo-500');
    }

    async function saveEventFromModal(existingId = null) {
      const title = document.getElementById('event-title').value.trim();
      if (!title) { showToast("Inserisci un titolo per l'evento"); return; }

      const eventData = {
        id: existingId || ('evt_' + Date.now()),
        title: title,
        description: document.getElementById('event-desc').value.trim(),
        date: document.getElementById('event-date').value,
        time: document.getElementById('event-time').value,
        endTime: document.getElementById('event-time-end').value || null,
        isAllDay: document.getElementById('event-allday').checked,
        recurrence: document.getElementById('event-recurrence').value,
        recurrenceEndDate: document.getElementById('event-recurrence-end').value || null,
        linkedBookId: document.getElementById('event-book').value || null,
        linkedMediaId: document.getElementById('event-media').value || null,
        photo: editingEventPhoto,
        icon: selectedEventIcon,
        updatedAt: new Date().toISOString()
      };

      await dbSave('calendar_events', eventData);
      closeModal();
      showToast(existingId ? "Evento aggiornato!" : "Evento creato!");
      render();
    }

    function confirmDeleteEvent(eventId) {
      const html = `
        <div class="text-center space-y-3">
          <span class="text-3xl">🗑️</span>
          <h3 class="font-bold text-base">Eliminare questo evento?</h3>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
            <button onclick="deleteEvent('${eventId}')" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold">Conferma Eliminazione</button>
          </div>
        </div>
      `;
      openModal(html);
    }

    async function deleteEvent(eventId) {
      await dbDelete('calendar_events', eventId);
      closeModal();
      showToast("Evento eliminato");
      render();
    }

    // --- INIZIALIZZAZIONE ---
    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      await loadSettings();

      // Se ci sono eventi in Agenda per oggi, apri direttamente quella scheda invece
      // della Lavagna di default, con un'evidenza sonora distinta (2 note) per farlo notare.
      const startupEvents = await dbGetAll('calendar_events');
      const startupToday = getLocalDateString();
      const hasEventsToday = startupEvents.some(e => eventOccursOnDate(e, startupToday));
      if (hasEventsToday) {
        currentTab = 'agenda';
        renderNavBar();
      }

      render();

      if (hasEventsToday) {
        SoundFX.playAgendaAlert();
      }

      // Controllo eventi del giorno: subito all'avvio, poi ogni 15 minuti circa mentre
      // l'app resta aperta, e ogni volta che torna in primo piano (cambio scheda/app).
      checkAndNotifyTodayEvents();
      setInterval(checkAndNotifyTodayEvents, 15 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          checkAndNotifyTodayEvents();
          // Rientro in primo piano: prova a scaricare eventuali modifiche fatte nel frattempo
          // su un altro dispositivo. Silenziosa: se il token è scaduto e serve login, non
          // interrompe l'utente con popup non richiesti — potrà usare "Sincronizza ora".
          if (appSettings.gdriveConnected && appSettings.gdriveAutoSync) gdriveSyncNow(false);
        } else {
          // Uscita/background: prova a caricare le modifiche appena fatte, così sono pronte
          // per essere scaricate dal prossimo dispositivo che apre l'app.
          if (appSettings.gdriveConnected && appSettings.gdriveAutoSync) gdriveSyncNow(false);
        }
      });

      // Sync silenziosa anche all'avvio vero e proprio dell'app (non solo al rientro).
      if (appSettings.gdriveConnected && appSettings.gdriveAutoSync) gdriveSyncNow(false);
    });
  </script>
</body>
</html>
