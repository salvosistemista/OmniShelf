  <script>
	// Il Service Worker DEVE essere un file reale servito da http/https: i browser rifiutano
	// per specifica la registrazione da blob: URL (lo script inline generato al volo usato in
	// precedenza non diventava mai attivo, e navigator.serviceWorker.ready restava bloccato
	// per sempre). Per questo sw.js è ora un file a parte, da caricare insieme a questo HTML.
	if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
	  window.addEventListener('load', () => {
		navigator.serviceWorker.register('./sw.js')
		  .then(() => console.log('PWA SW attivato'))
		  .catch((err) => console.warn('PWA SW non disponibile in questa modalità:', err));
	  });
	}

    function getLocalDateString(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatCustomDate(dateString) {
      if (!dateString) return '';
      const parts = dateString.split('-');
      let dateObj = parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date(dateString);
      if (isNaN(dateObj.getTime())) return dateString;

      const day = dateObj.getDate();
      const monthNames = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
      return `${day} ${monthNames[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
    }

    // --- GESTIONE RICORRENZE EVENTI AGENDA ---
    function parseLocalDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function daysBetween(dateStr1, dateStr2) {
      const d1 = parseLocalDate(dateStr1);
      const d2 = parseLocalDate(dateStr2);
      return Math.round((d2 - d1) / 86400000);
    }

    // Determina se un evento (eventualmente ricorrente) occorre in una data specifica.
    // Gli eventi ricorrenti non vengono duplicati nel DB: l'occorrenza è calcolata al volo
    // a partire dalla data base dell'evento (event.date) verso il futuro.
    function eventOccursOnDate(event, dateStr) {
      if (!event.date) return false;
      const recurrence = event.recurrence || 'NONE';

      if (recurrence === 'NONE') return event.date === dateStr;
      if (dateStr < event.date) return false; // nessuna occorrenza prima della data base
      if (event.recurrenceEndDate && dateStr > event.recurrenceEndDate) return false; // termine ricorrenza superato

      const base = parseLocalDate(event.date);
      const target = parseLocalDate(dateStr);

      switch (recurrence) {
        case 'DAILY':
          return true;
        case 'WEEKLY': {
          const diff = daysBetween(event.date, dateStr);
          return diff % 7 === 0;
        }
        case 'MONTHLY': {
          const baseDay = base.getDate();
          const lastDayOfTargetMonth = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
          const effectiveDay = Math.min(baseDay, lastDayOfTargetMonth); // clamp es. 31 -> ultimo giorno del mese
          return target.getDate() === effectiveDay;
        }
        case 'YEARLY':
          return target.getDate() === base.getDate() && target.getMonth() === base.getMonth();
        default:
          return event.date === dateStr;
      }
    }

    // Calcola tutte le attività (eventi espansi + note + log + media) per una singola data.
    function getDayActivity(dateStr, allEvents, notesMap, logsMap, mediaMap, mediaLogsMap) {
      const todaysEvents = allEvents.filter(e => eventOccursOnDate(e, dateStr));

      // Ordine: eventi "Tutto il giorno" prima, poi quelli con orario in ordine crescente,
      // infine eventuali eventi senza orario né flag tutto il giorno.
      todaysEvents.sort((a, b) => {
        if (a.isAllDay && !b.isAllDay) return -1;
        if (!a.isAllDay && b.isAllDay) return 1;
        if (a.isAllDay && b.isAllDay) return 0;
        if (!a.time && !b.time) return 0;
        if (!a.time) return 1;
        if (!b.time) return -1;
        return a.time.localeCompare(b.time);
      });

      return {
        events: todaysEvents,
        notes: notesMap[dateStr] || [],
        logs: logsMap[dateStr] || [],
        media: mediaMap[dateStr] || [],
        mediaLogs: (mediaLogsMap && mediaLogsMap[dateStr]) || []
      };
    }

    const EXTENDED_ICONS = [
      '📝', '💡', '📖', '⭐', '☕', '🎯', '🔖', '📌', 
      '🎟️', '🏛️', '⏰', '🎂', '🎓', '💻', '💼', '🎨', 
      '🚀', '🏆', '🎧', '✈️', '🛒', '🏋️', '🧘', '🔑',
      '🎬', '📺', '🎮', '🎙️', '🍿', '📼', '📰', '🎶',
      '💍', '🩺', '💊', '🍹', '🍽️', '🛠️', '🦷'
    ];

    const DEFAULT_GENRES = [
      'Fantascienza', 'Fantasy', 'Giallo/Thriller', 'Saggistica', 
      'Classici', 'Narrativa', 'Biografia', 'Storico', 'Manga/Comics'
    ];

    const MEDIA_TYPES = [
      { id: 'MOVIE', label: 'Film', icon: '🎬', unit: 'Minuti' },
      { id: 'TV_SHOW', label: 'Serie TV', icon: '📺', unit: 'Episodi' },
      { id: 'GAME', label: 'Videogiochi', icon: '🎮', unit: 'Ore' },
      { id: 'PODCAST', label: 'Podcast', icon: '🎙️', unit: 'Episodi' },
      { id: 'ARTICLE', label: 'Articoli', icon: '📰', unit: 'Pagine / %' },
      { id: 'MUSIC', label: 'Musica / Album', icon: '🎶', unit: 'Tracce' }
    ];

    const SoundFX = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playTap() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch(e) {}
      },
      // Chime a due note ascendenti (Re5 -> Sol5), distinta dal semplice "tap" dei click:
      // usata per segnalare che ci sono eventi in Agenda per oggi all'apertura dell'app.
      playAgendaAlert() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        try {
          const notes = [587.33, 783.99];
          let startTime = this.ctx.currentTime;
          notes.forEach((freq) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.linearRampToValueAtTime(0.09, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.3);
            startTime += 0.19;
          });
        } catch(e) {}
      }
    };

    const DB_NAME = 'OmniShelfMasterDB';
    const DB_VERSION = 7;
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject('Errore apertura Database');
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('settings')) database.createObjectStore('settings', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('books')) database.createObjectStore('books', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('calendar_events')) database.createObjectStore('calendar_events', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('board_notes')) database.createObjectStore('board_notes', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('reading_logs')) database.createObjectStore('reading_logs', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('custom_genres')) database.createObjectStore('custom_genres', { keyPath: 'name' });
          if (!database.objectStoreNames.contains('media_items')) database.createObjectStore('media_items', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('media_logs')) database.createObjectStore('media_logs', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('custom_collections')) database.createObjectStore('custom_collections', { keyPath: 'name' });
        };
      });
    }

    // Cache in memoria per libri e media: la lettura di queste due tabelle da IndexedDB è
    // diventata pesante ora che quasi ogni record include una copertina in base64. La cache
    // evita di rileggerle dal database ad ogni singolo re-render (es. cambio giorno in Agenda);
    // viene invalidata automaticamente da dbSave/dbDelete qui sotto, quindi resta sempre
    // aggiornata senza bisogno di ricordarsene in ogni punto del codice che modifica libri/media.
    let cachedBooks = null;
    let cachedMediaItems = null;

    function invalidateBooksMediaCache() {
      cachedBooks = null;
      cachedMediaItems = null;
    }

    async function getCachedBooks() {
      if (!cachedBooks) cachedBooks = await dbGetAll('books');
      return cachedBooks;
    }

    async function getCachedMediaItems() {
      if (!cachedMediaItems) cachedMediaItems = await dbGetAll('media_items');
      return cachedMediaItems;
    }

    function dbSave(storeName, data) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(data);
        tx.oncomplete = () => {
          if (storeName === 'books' || storeName === 'media_items') invalidateBooksMediaCache();
          resolve(true);
        };
      });
    }

    function dbGetAll(storeName) {
      return new Promise((resolve) => {

      });
    }

    function dbDelete(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => {
          if (storeName === 'books' || storeName === 'media_items') invalidateBooksMediaCache();
          resolve(true);
        };
      });
    }

    function dbClearStore(storeName) {

        tx.objectStore(storeName).clear();
        tx.oncomplete = () => resolve(true);

    // Mostra una notifica reale. Su Chrome Android il costruttore diretto `new Notification()`
    // è disabilitato ("illegal constructor") — bisogna passare dal Service Worker già
    // registrato per il funzionamento offline della PWA, tramite showNotification().
    // Un timeout evita che l'attesa del Service Worker resti bloccata in silenzio per sempre.
    async function showAppNotification(title, options) {
      if (!("Notification" in window)) throw new Error("API Notification non disponibile in questo ambiente");
      if (Notification.permission !== 'granted') throw new Error("Permesso notifiche non concesso");

      if ('serviceWorker' in navigator) {
        const registration = await Promise.race([
          navigator.serviceWorker.ready,
          new Promise((_, reject) => setTimeout(() => reject(new Error("Service Worker non pronto (timeout dopo 4s)")), 4000))
        ]);
        await registration.showNotification(title, options);
      } else {
        new Notification(title, options);
      }
    }

    // Notifica diagnostica: serve solo a verificare se, sull'ambiente in cui gira l'app
    // (browser reale o WebView dell'APK), le notifiche vengono effettivamente mostrate.
    // Se questa non compare, il problema è nell'ambiente di esecuzione, non nel codice.
    async function sendTestNotification() {
      SoundFX.playTap();
      try {
        await showAppNotification("OmniShelf", { body: "Se vedi questa notifica, il sistema funziona su questo dispositivo! 🎉" });
        showToast("Notifica di prova inviata");
      } catch (e) {
        console.warn('Errore invio notifica di prova:', e);
        showToast("Errore: " + e.message);

    }

    // --- NOTIFICA AUTOMATICA EVENTI DEL GIORNO (dentro una fascia oraria scelta) ---
    // Tiene traccia degli eventi già notificati OGGI per non ripetere la stessa notifica
    // ad ogni controllo periodico. L'insieme si azzera da solo appena cambia la data.
    let notifiedEventIdsToday = new Set();
    let notifiedDateTracker = '';

    function isWithinNotifyWindow() {
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const [startH, startM] = (appSettings.notifyWindowStart || '00:00').split(':').map(Number);
      const [endH, endM] = (appSettings.notifyWindowEnd || '23:59').split(':').map(Number);
      const startMinutes = startH * 60 + startM;
      const endMinutes = endH * 60 + endM;
      if (startMinutes <= endMinutes) {
        return nowMinutes >= startMinutes && nowMinutes <= endMinutes;
      }
      // Fascia che attraversa la mezzanotte (es. 22:00 -> 06:00)
      return nowMinutes >= startMinutes || nowMinutes <= endMinutes;
    }

    async function checkAndNotifyTodayEvents() {
      if (!appSettings.notificationsEnabled) return;
      if (!("Notification" in window) || Notification.permission !== 'granted') return;
      if (!isWithinNotifyWindow()) return;

      const today = getLocalDateString();
      if (notifiedDateTracker !== today) {
        notifiedDateTracker = today;
        notifiedEventIdsToday = new Set();
      }

      const events = await dbGetAll('calendar_events');
      const todaysEvents = events.filter(e => eventOccursOnDate(e, today));

      for (const evt of todaysEvents) {
        if (notifiedEventIdsToday.has(evt.id)) continue;
        notifiedEventIdsToday.add(evt.id);
        try {
          await showAppNotification(evt.title || 'Promemoria OmniShelf', {
            body: evt.isAllDay ? 'Evento di tutto il giorno' : (evt.time ? `Ore ${evt.time}` : 'In programma per oggi'),
            tag: 'omnishelf-event-' + evt.id
          });
        } catch (e) {
          console.warn('Notifica evento fallita:', evt.id, e);
        }
      }
    }

    async function updateGlobalSearchResults() {
      const input = document.getElementById('global-search-input');
      const results = document.getElementById('global-search-results');

      const q = input.value.trim().toLowerCase();
      if (!q) {
        results.innerHTML = `<p class="text-[11px] opacity-50 italic text-center py-4">Inizia a digitare per cercare tra libri, media e note...</p>`;
        return;
      }

      const [books, mediaItems, notes] = await Promise.all([
        dbGetAll('books'),
        dbGetAll('media_items'),
        dbGetAll('board_notes')
      ]);

      const matchedBooks = books.filter(b =>

        (b.author || '').toLowerCase().includes(q) ||

      const matchedMedia = mediaItems.filter(m =>
        (m.title || '').toLowerCase().includes(q) ||

      );

      const matchedNotes = notes.filter(n =>
        (n.title || '').toLowerCase().includes(q) ||
        (n.content || '').toLowerCase().includes(q)
      );

      if (matchedBooks.length === 0 && matchedMedia.length === 0 && matchedNotes.length === 0) {
        results.innerHTML = `<p class="text-[11px] opacity-50 italic text-center py-4">Nessun risultato per "${input.value}".</p>`;
        return;

      let html = '';

      if (matchedBooks.length > 0) {
        html += `<div>

                  <p class="text-[10px] opacity-60 truncate">${b.author || 'Autore sconosciuto'}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>`;
      }

      if (matchedMedia.length > 0) {
        html += `<div>
          <p class="text-[10px] font-bold ui-accent-text uppercase tracking-wider mb-1.5">Media Log</p>
          <div class="space-y-1.5">
            ${matchedMedia.map(m => {

                    <p class="text-[10px] opacity-60 truncate">${typeObj.label}${m.creator ? ' · ' + m.creator : ''}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>`;
      }

      if (matchedNotes.length > 0) {
        html += `<div>
          <p class="text-[10px] font-bold ui-accent-text uppercase tracking-wider mb-1.5">Lavagna</p>

              </div>
            `).join('')}

    // Comprime un'immagine (data URL) ridimensionandola a maxWidth, poi riduce
    // progressivamente la qualità JPEG finché il peso reale (stimato dalla lunghezza
    // della stringa base64) non scende sotto targetBytes, o si raggiunge una qualità minima.
    function compressImageToTarget(dataUrl, maxWidth, targetBytes = 102400) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.naturalWidth || img.width;
          let height = img.naturalHeight || img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.8;
          let result = canvas.toDataURL('image/jpeg', quality);

          // Stima byte reali dalla lunghezza base64 (~4/3 del peso originale, quindi *0.75 per stimare al contrario)
          while (result.length * 0.75 > targetBytes && quality > 0.5) {
            quality -= 0.05;
            result = canvas.toDataURL('image/jpeg', quality);
          }

          resolve(result);
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    // Stima il peso reale in KB di un'immagine salvata come data URL base64
    // (la stringa base64 pesa ~4/3 del file binario originale, quindi si stima al contrario con *0.75).
    function estimatePhotoSizeKB(dataUrl) {
      if (!dataUrl) return 0;
      const base64Part = dataUrl.split(',')[1] || dataUrl;
      return Math.round((base64Part.length * 0.75) / 1024);
    }

    // Lightbox a schermo intero con pinch-to-zoom e trascinamento personalizzati.
    // Necessario perché l'app disabilita lo zoom nativo del browser (user-scalable=no)
    // per evitare zoom accidentali sull'interfaccia mentre si usa l'app normalmente.
    function openImageLightbox(src) {
      const overlay = document.createElement('div');
      overlay.id = 'image-lightbox-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;';
      overlay.innerHTML = `
        <img id="lightbox-img" src="${src}" style="max-width:100%;max-height:100%;transform-origin:center center;user-select:none;-webkit-user-drag:none;">
        <button id="lightbox-close" style="position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:9999px;background:rgba(255,255,255,0.15);color:white;font-size:18px;font-weight:bold;border:none;">✕</button>
        <p style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.5);font-size:11px;">Pizzica per zoomare · doppio tap per azzerare</p>
      `;
      document.body.appendChild(overlay);

      const img = document.getElementById('lightbox-img');
      let scale = 1, translateX = 0, translateY = 0;
      let startDistance = 0, startScale = 1;
      let isPanning = false, lastX = 0, lastY = 0;
      let lastTapTime = 0;

      function applyTransform() {
        img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      }

      function getDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      overlay.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          startDistance = getDistance(e.touches);
          startScale = scale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTapTime < 300) {
            scale = 1; translateX = 0; translateY = 0;
            applyTransform();
          }
          lastTapTime = now;
          isPanning = scale > 1;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        }
      }, { passive: true });

      overlay.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const newDistance = getDistance(e.touches);
          if (startDistance > 0) {
            scale = Math.min(5, Math.max(1, startScale * (newDistance / startDistance)));
            applyTransform();
          }
        } else if (e.touches.length === 1 && isPanning) {
          const dx = e.touches[0].clientX - lastX;
          const dy = e.touches[0].clientY - lastY;
          translateX += dx;
          translateY += dy;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          applyTransform();
        }
      }, { passive: true });

      overlay.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) isPanning = false;
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeImageLightbox();
      });
      document.getElementById('lightbox-close').addEventListener('click', closeImageLightbox);
    }

    async function processAndCompressCover(sourceUrlOrBase64) {
      if (!sourceUrlOrBase64 || !sourceUrlOrBase64.trim()) return '';
      const input = sourceUrlOrBase64.trim();

      const loadImage = (src) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => resolve(img);
          img.onerror = (err) => reject(err);
          img.src = src;
        });
      };

      let imgLoaded = null;
      try {
        imgLoaded = await loadImage(input);
      } catch (e1) {
        if (input.startsWith('http')) {
          try {
            const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(input);
            imgLoaded = await loadImage(proxyUrl);
          } catch (e2) {
            return input;
          }
        } else {
          return input;
        }
      }

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const MAX_WIDTH = 150;
      let width = imgLoaded.naturalWidth || imgLoaded.width || 300;
      let height = imgLoaded.naturalHeight || imgLoaded.height || 450;

      if (width > MAX_WIDTH) {
        height = Math.round((height * MAX_WIDTH) / width);
        width = MAX_WIDTH;
      }

      canvas.width = width;
      canvas.height = height;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(imgLoaded, 0, 0, width, height);

      return canvas.toDataURL('image/jpeg', 0.75);
    }

    async function recordReadingLog(bookId, pagesAdded, targetPage) {
      if (pagesAdded <= 0) return;
      const today = getLocalDateString();
      const logs = await dbGetAll('reading_logs');
      const existingLog = logs.find(l => l.date === today && l.bookId === bookId);

      if (existingLog) {
        existingLog.pagesRead += pagesAdded;
        existingLog.reachedPage = targetPage;
        await dbSave('reading_logs', existingLog);
      } else {
        await dbSave('reading_logs', {
          id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          bookId: bookId,
          date: today,
          pagesRead: pagesAdded,
          reachedPage: targetPage
        });
      }
    }

    // Crea automaticamente un log di fine lettura (data = Data Fine Lettura, pagine lette =
    // pagine totali del libro), utile per chi non ha mai registrato progressi giorno per giorno
    // ma ha comunque impostato lo stato Completato con una data fine. Non duplica se esiste
    // già un log per quella stessa data.
    async function createEndReadingLog(bookId) {
      SoundFX.playTap();
      const books = await dbGetAll('books');
      const book = books.find(b => b.id === bookId);
      if (!book) return;

      if (!book.endDate) {
        showToast("Imposta prima la Data Fine Lettura");
        return;
      }
      const totalPages = book.totalPages || 0;
      if (totalPages <= 0) {
        showToast("Il libro non ha un numero di Pagine Totali valido");
        return;
      }

      const logs = await dbGetAll('reading_logs');
      const existingLog = logs.find(l => l.bookId === bookId && l.date === book.endDate);
      if (existingLog) {
        showToast("Esiste già un log di lettura per quella data");
        return;
      }

      await dbSave('reading_logs', {
        id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        bookId: bookId,
        date: book.endDate,
        pagesRead: totalPages,
        reachedPage: totalPages
      });

      showToast("Log di fine lettura creato!");
      render();
      openBookModal(bookId);
    }

    // Registro di visione/ascolto per i Media Log, mirror di recordReadingLog per i libri.
    // unitsAdded è espresso nell'unità propria del tipo (Minuti/Episodi/Ore/Pagine/Tracce);
    // per le Serie TV rappresenta la somma di episodi avanzati su tutte le stagioni.
    async function recordMediaLog(mediaId, unitsAdded, reachedUnit) {
      if (unitsAdded <= 0) return;
      const today = getLocalDateString();
      const logs = await dbGetAll('media_logs');
      const existingLog = logs.find(l => l.date === today && l.mediaId === mediaId);

      if (existingLog) {
        existingLog.unitsRead += unitsAdded;
        existingLog.reachedUnit = reachedUnit;
        await dbSave('media_logs', existingLog);
      } else {
        await dbSave('media_logs', {
          id: 'mlog_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          mediaId: mediaId,
          date: today,
          unitsRead: unitsAdded,
          reachedUnit: reachedUnit

    // Calcola stato di lettura e date (inizio/fine) in base alla percentuale impostata.
    // Regole condivise tra il campo % rapido in Libreria e la Scheda Libro Completa:
    // 0% -> Da leggere; 0% < % < 100% -> In lettura (Data Inizio se assente); 100% -> Letto (Data Fine se assente).
    function computeReadingStateFromPercent(percent, existingStartDate, existingEndDate) {
      const today = getLocalDateString();
      let status, startDate = existingStartDate || '', endDate = existingEndDate || '';

      if (percent <= 0) {
        status = 'TO_READ';
      } else if (percent < 100) {
        status = 'READING';
        if (!startDate) startDate = today;
      } else {
        status = 'COMPLETED';
        if (!endDate) endDate = today;
      }

      return { status, startDate, endDate };
    }

    async function updateBookPercentQuick(bookId, percentValue, e) {
      if (e) e.stopPropagation();
      SoundFX.playTap();

      let percent = parseInt(percentValue);
      if (isNaN(percent)) { render(); return; }
      percent = Math.max(0, Math.min(100, percent));

      const books = await dbGetAll('books');
      const book = books.find(b => b.id === bookId);
      if (!book) return;

      const totalPages = book.totalPages || 0;
      const oldPage = book.currentPage || 0;
      const newPage = totalPages > 0 ? Math.round((percent / 100) * totalPages) : oldPage;

      const { status, startDate, endDate } = computeReadingStateFromPercent(percent, book.startDate, book.endDate);

      const pagesChanged = newPage - oldPage;
      book.currentPage = newPage;
      book.status = status;
      book.startDate = startDate || null;
      book.endDate = endDate || null;
      if (pagesChanged !== 0) book.lastReadAt = new Date().toISOString();

      await dbSave('books', book);
      if (pagesChanged > 0) {
        await recordReadingLog(bookId, pagesChanged, newPage);
      }
      render();
    }

    async function moveNoteOrder(noteId, direction) {
      SoundFX.playTap();
      const notes = await dbGetAll('board_notes');
      notes.sort((a, b) => (a.order || 0) - (b.order || 0));
      const idx = notes.findIndex(n => n.id === noteId);
      if (idx === -1) return;

      const targetIdx = direction === 'UP' ? idx - 1 : idx + 1;
      if (targetIdx < 0 || targetIdx >= notes.length) return;

      const temp = notes[idx].order || idx;
      notes[idx].order = notes[targetIdx].order || targetIdx;
      notes[targetIdx].order = temp;

      await dbSave('board_notes', notes[idx]);
      await dbSave('board_notes', notes[targetIdx]);
      render();
    }

    // --- BACKUP JSON EXPORT / IMPORT ---
    // Restituisce le impostazioni da includere nei backup, con le credenziali sensibili
    // (password WebDAV) rimosse: altrimenti finirebbero copiate in chiaro in ogni JSON
    // esportato/inviato, incluso il backup mandato allo stesso WebDAV.
    async function getSanitizedSettingsForExport() {
      const settings = await dbGetAll('settings');
      return settings.map(s => ({ ...s, webdavPassword: undefined }));
    }

    async function exportJSONBackup() {
      SoundFX.playTap();
      try {
        const backupData = {
          version: DB_VERSION,
          exportDate: new Date().toISOString(),
          settings: await getSanitizedSettingsForExport(),
          books: await dbGetAll('books'),
          calendar_events: await dbGetAll('calendar_events'),
          board_notes: await dbGetAll('board_notes'),
          reading_logs: await dbGetAll('reading_logs'),
          custom_genres: await dbGetAll('custom_genres'),
          media_items: await dbGetAll('media_items'),
          media_logs: await dbGetAll('media_logs'),
          custom_collections: await dbGetAll('custom_collections')
        };

        const jsonStr = JSON.stringify(backupData, null, 2);
        const fileName = `omnishelf_backup_${getLocalDateString()}.json`;
        const blob = new Blob([jsonStr], { type: 'application/json' });

        // Su WebView semplici (come quelle generate da app-builder tipo webintoapp.com) il
        // download via <a download> spesso non funziona: non esiste un gestore download del
        // browser da intercettare. La condivisione nativa (navigator.share) delega la scelta
        // "dove salvare" al sistema operativo stesso, ed è molto più affidabile in questi casi.
        let sharedNatively = false;
        if (navigator.canShare) {
          try {
            const file = new File([blob], fileName, { type: 'application/json' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: 'Backup OmniShelf',
                text: 'Backup dati OmniShelf'
              });
              sharedNatively = true;
              showToast("Backup condiviso! Scegli dove salvarlo.");
            }
          } catch (shareErr) {
            // L'utente ha annullato la condivisione, oppure non è supportata: proseguiamo
            // comunque con il metodo classico come ripiego, senza mostrare errore per un annullo.
            if (shareErr.name !== 'AbortError') {
              console.warn('Condivisione nativa non riuscita, uso il metodo classico:', shareErr);
            } else {
              sharedNatively = true; // annullato volontariamente: non serve un secondo tentativo
            }
          }
        }

        if (!sharedNatively) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast("Backup JSON esportato con successo!");
        }
      } catch (e) {
        console.error("Errore esportazione backup:", e);
        showToast("Errore durante l'esportazione del backup");
      }
    }

    // Backup alternativo via email (per bypassare i limiti di download/condivisione di
    // alcune WebView impacchettate in APK). Usa EmailJS, un servizio gratuito che invia
    // email direttamente dal browser senza bisogno di un server proprio. Per restare dentro
    // al limite di 500KB del piano gratuito, le copertine (base64, spesso le più pesanti)
    // vengono escluse da questo specifico backup.
    async function exportBackupViaEmail() {
      SoundFX.playTap();

      const { backupWebhookUrl, backupEmailAddress } = appSettings;
      if (!backupWebhookUrl || !backupEmailAddress) {
        showToast("Compila prima l'URL dello script ed Email di destinazione");
        return;
      }

      const includeCovers = document.getElementById('email-backup-include-covers').checked;

      try {
        const rawBooks = await dbGetAll('books');
        const rawMedia = await dbGetAll('media_items');

        const backupData = {
          version: DB_VERSION,
          exportDate: new Date().toISOString(),
          settings: await getSanitizedSettingsForExport(),
          books: includeCovers ? rawBooks : rawBooks.map(b => ({ ...b, coverUrl: undefined })),
          calendar_events: await dbGetAll('calendar_events'),
          board_notes: await dbGetAll('board_notes'),
          reading_logs: await dbGetAll('reading_logs'),
          custom_genres: await dbGetAll('custom_genres'),
          media_items: includeCovers ? rawMedia : rawMedia.map(m => ({ ...m, coverUrl: undefined })),
          media_logs: await dbGetAll('media_logs'),
          custom_collections: await dbGetAll('custom_collections')
        };

        const jsonStr = JSON.stringify(backupData);
        const sizeMB = (new Blob([jsonStr]).size / 1024 / 1024).toFixed(2);

        // Gmail rifiuta sempre allegati oltre i 25MB: se il backup li supera, evitiamo
        // di tentare l'invio (fallirebbe comunque) e diciamo chiaramente perché.
        if (sizeMB > 24) {
          showToast(`Backup di ${sizeMB}MB, oltre il limite di 25MB di Gmail. ${includeCovers ? 'Prova senza copertine, o usa WebDAV/download per il backup completo.' : 'Anche senza copertine è troppo grande: usa WebDAV o il download standard.'}`);
          return;
        }

        showToast("Invio in corso...");

        const response = await fetch(backupWebhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' }, // evita la richiesta preflight CORS su Apps Script
          body: JSON.stringify({
            to_email: backupEmailAddress,
            backup_date: getLocalDateString(),
            backup_content: jsonStr
          })
        });

        if (!response.ok) throw new Error('Risposta HTTP ' + response.status);

        showToast(`Backup inviato a ${backupEmailAddress}! (${sizeMB}MB${includeCovers ? '' : ', senza copertine'})`);
      } catch (e) {
        console.error("Errore invio backup via email:", e);
        showToast("Errore nell'invio: " + (e.message || 'controlla l\'URL dello script'));
      }
    }

    // Backup su server WebDAV (Nextcloud, ownCloud, o qualunque server WebDAV) tramite una
    // richiesta PUT diretta con autenticazione Basic. Nota: molti server WebDAV non hanno CORS
    // abilitato per richieste da pagine web esterne — se il tuo server non lo consente, questa
    // richiesta fallirà con un errore di rete (non è un bug del codice, è una configurazione
    // lato server che va eventualmente abilitata da chi amministra quel server).
    async function exportBackupToWebDAV() {
      SoundFX.playTap();

      const { webdavUrl, webdavUsername, webdavPassword } = appSettings;
      if (!webdavUrl) {
        showToast("Compila prima l'URL del server WebDAV");
        return;
      }

      try {
        const backupData = {
          version: DB_VERSION,
          exportDate: new Date().toISOString(),
          settings: await getSanitizedSettingsForExport(),
          books: await dbGetAll('books'),
          calendar_events: await dbGetAll('calendar_events'),
          board_notes: await dbGetAll('board_notes'),
          reading_logs: await dbGetAll('reading_logs'),
          custom_genres: await dbGetAll('custom_genres'),
          media_items: await dbGetAll('media_items'),
          media_logs: await dbGetAll('media_logs'),
          custom_collections: await dbGetAll('custom_collections')
        };

        const jsonStr = JSON.stringify(backupData, null, 2);
        const fileName = `omnishelf_backup_${getLocalDateString()}.json`;
        const targetUrl = webdavUrl.replace(/\/+$/, '') + '/' + fileName;

        const headers = { 'Content-Type': 'application/json' };
        if (webdavUsername || webdavPassword) {
          headers['Authorization'] = 'Basic ' + btoa(`${webdavUsername}:${webdavPassword}`);
        }

        showToast("Invio in corso...");

        const response = await fetch(targetUrl, {
          method: 'PUT',
          headers: headers,
          body: jsonStr
        });

        if (!response.ok) throw new Error(`Risposta HTTP ${response.status} (${response.statusText})`);

        showToast(`Backup caricato su WebDAV: ${fileName}`);
      } catch (e) {
        console.error("Errore backup WebDAV:", e);
        showToast("Errore WebDAV: " + (e.message || 'controlla URL/credenziali, o CORS non abilitato sul server'));
      }
    }

    // --- EXPORT CSV (Libreria o Media, con separatore ";") ---
    function convertToCSVValue(val) {
      if (Array.isArray(val)) val = val.join(',');
      if (val === null || val === undefined) val = '';
      val = String(val);
      if (val.includes(';') || val.includes('"') || val.includes('\n')) {
        val = '"' + val.replace(/"/g, '""') + '"';
      }
      return val;
    }

    async function exportCSV() {
      SoundFX.playTap();
      const catalog = document.getElementById('csv-export-catalog').value;
      const includeCover = document.getElementById('csv-export-cover').checked;
      const method = document.getElementById('csv-export-method').value;

      const storeName = catalog === 'books' ? 'books' : 'media_items';
      const items = await dbGetAll(storeName);

      let columns = catalog === 'books'
        ? ['title', 'author', 'publisher', 'publishYear', 'isbn', 'format', 'seriesName', 'seriesVol', 'status', 'wishlist', 'totalPages', 'currentPage', 'rating', 'startDate', 'endDate', 'info', 'genres', 'collections']
        : ['title', 'type', 'creator', 'platform', 'articleLocation', 'status', 'wishlist', 'totalUnits', 'currentUnit', 'rating', 'startDate', 'endDate', 'info', 'genres', 'collections'];
      if (includeCover) columns.push('coverUrl');

      const rows = [columns.join(';')];
      items.forEach(item => {
        rows.push(columns.map(col => convertToCSVValue(item[col])).join(';'));
      });

      const csvContent = rows.join('\n');
      const fileName = `omnishelf_${catalog}_${getLocalDateString()}.csv`;

      if (method === 'webhook') {
        const { backupWebhookUrl, backupEmailAddress } = appSettings;
        if (!backupWebhookUrl || !backupEmailAddress) {
          showToast("Compila prima URL script ed Email nella sezione Backup via Email");
          return;
        }
        try {
          showToast("Invio in corso...");
          const response = await fetch(backupWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ to_email: backupEmailAddress, backup_date: getLocalDateString(), backup_content: csvContent, file_name: fileName })
          });
          if (!response.ok) throw new Error('Risposta HTTP ' + response.status);
          showToast(`CSV inviato a ${backupEmailAddress}!`);
        } catch (e) {
          console.error("Errore invio CSV via email:", e);
          showToast("Errore nell'invio: " + e.message);
        }
        return;
      }

      try {
        const blob = new Blob([csvContent], { type: 'text/csv' });
        let sharedNatively = false;
        if (navigator.canShare) {
          try {
            const file = new File([blob], fileName, { type: 'text/csv' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: 'Export CSV OmniShelf' });
              sharedNatively = true;
            }
          } catch (shareErr) {
            if (shareErr.name === 'AbortError') sharedNatively = true;
            else console.warn('Condivisione nativa non riuscita, uso il download classico:', shareErr);
          }
        }
        if (!sharedNatively) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast("CSV esportato con successo!");
        }
      } catch (e) {
        console.error("Errore esportazione CSV:", e);
        showToast("Errore durante l'esportazione del CSV");
      }
    }

    // --- IMPORT CSV (solo Libreria) ---
    // Campi riconoscibili nell'intestazione del CSV per decidere aggiunta/aggiornamento.
    // Ogni campo ha una lista di sinonimi (nomi header accettati, case-insensitive) da
    // riconoscere sia nei CSV esportati da questa stessa app sia in file esterni con nomi
    // di colonna in italiano.
    const CSV_IMPORT_CANDIDATE_FIELDS = [
      { key: 'title', label: 'Titolo', synonyms: ['title', 'titolo'] },
      { key: 'author', label: 'Autore', synonyms: ['author', 'autore'] },
      { key: 'publisher', label: 'Editore', synonyms: ['publisher', 'editore'] },
      { key: 'publishYear', label: 'Anno di pubblicazione', synonyms: ['publishyear', 'anno', 'anno di pubblicazione', 'anno pubblicazione'] },
      { key: 'isbn', label: 'Codice ISBN', synonyms: ['isbn', 'codice isbn'] },
      { key: 'format', label: 'Formato', synonyms: ['format', 'formato'] }
    ];

    function parseCSVLine(line, delimiter) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"') {
            if (line[i + 1] === '"') { cur += '"'; i++; }
            else { inQuotes = false; }
          } else {
            cur += ch;
          }
        } else {
          if (ch === '"') { inQuotes = true; }
          else if (ch === delimiter) { result.push(cur); cur = ''; }
          else { cur += ch; }
        }
      }
      result.push(cur);
      return result;
    }

    function parseCSVText(text, delimiter = ';') {
      const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim().length > 0);
      if (lines.length === 0) return { headers: [], rows: [] };
      const headers = parseCSVLine(lines[0], delimiter).map(h => h.trim());
      const rows = lines.slice(1).map(line => parseCSVLine(line, delimiter));
      return { headers, rows };
    }

    let pendingCSVImport = null;

    async function handleCSVImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const text = await file.text();
      const { headers, rows } = parseCSVText(text, ';');

      if (headers.length === 0 || rows.length === 0) {
        showToast("File CSV vuoto o non leggibile");
        return;
      }

      const headersLower = headers.map(h => h.trim().toLowerCase());
      const availableFields = CSV_IMPORT_CANDIDATE_FIELDS.filter(f =>
        f.synonyms.some(syn => headersLower.includes(syn))
      );

      if (availableFields.length === 0) {
        showToast("Nessuno dei campi riconoscibili (Titolo, Autore, Editore, Anno, ISBN, Formato) è presente nell'intestazione del file");
        return;
      }

      pendingCSVImport = { headers, headersLower, rows, availableFields };
      openCSVImportFieldSelectionModal();
    }

    function openCSVImportFieldSelectionModal() {
      const { availableFields, rows } = pendingCSVImport;
      const html = `
        <div class="flex justify-between items-center pb-2 border-b border-gray-500/20">
          <h3 class="font-bold text-base">Importa CSV — Libreria</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
        </div>
        <div class="space-y-3 text-xs pt-3">
          <p class="opacity-70">${rows.length} righe trovate nel file. Seleziona quali campi devono coincidere per considerare un libro "già esistente" (altrimenti verrà creato un nuovo libro). Solo i campi presenti nel file sono selezionabili.</p>
          <div class="space-y-1.5">
            ${availableFields.map((f, idx) => `
              <label class="flex items-center gap-2 p-2 rounded-lg bg-gray-500/10 border border-gray-500/20 cursor-pointer">
                <input type="checkbox" id="csv-match-field-${f.key}" class="rounded accent-indigo-600" ${idx < 2 ? 'checked' : ''}>
                <span>${f.label}</span>
              </label>
            `).join('')}
          </div>
        </div>
        <div class="flex gap-2 pt-3">
          <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
          <button onclick="computeCSVImportPreview()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Continua</button>
        </div>
      `;
      openModal(html);
    }

    function getCSVColumnIndex(field, headersLower) {
      for (const syn of field.synonyms) {
        const idx = headersLower.indexOf(syn);
        if (idx !== -1) return idx;
      }
      return -1;
    }

    async function computeCSVImportPreview() {
      const { availableFields, rows, headersLower } = pendingCSVImport;
      const selectedFields = availableFields.filter(f => document.getElementById(`csv-match-field-${f.key}`).checked);

      if (selectedFields.length === 0) {
        showToast("Seleziona almeno un campo di confronto");
        return;
      }

      const existingBooks = await dbGetAll('books');
      const titleField = CSV_IMPORT_CANDIDATE_FIELDS[0];
      const titleIdx = getCSVColumnIndex(titleField, headersLower);

      const additions = [];
      const updates = [];

      rows.forEach(row => {
        const rowValues = {};
        availableFields.forEach(f => {
          const idx = getCSVColumnIndex(f, headersLower);
          rowValues[f.key] = idx !== -1 ? (row[idx] || '').trim() : '';
        });

        const match = existingBooks.find(b => selectedFields.every(f => {
          const bookVal = (b[f.key] || '').toString().trim().toLowerCase();
          const rowVal = (rowValues[f.key] || '').toString().trim().toLowerCase();
          return bookVal === rowVal;
        }));

        const rowTitle = titleIdx !== -1 ? (row[titleIdx] || '(senza titolo)') : '(senza titolo)';

        if (match) updates.push({ row, match, title: rowTitle });
        else additions.push({ row, title: rowTitle });
      });

      pendingCSVImport.selectedFields = selectedFields;
      pendingCSVImport.additions = additions;
      pendingCSVImport.updates = updates;

      showCSVImportSummary();
    }

    function showCSVImportSummary() {
      const { additions, updates } = pendingCSVImport;
      const exampleAdds = additions.slice(0, 3).map(a => a.title).filter(Boolean);
      const exampleUpdates = updates.slice(0, 3).map(u => u.title).filter(Boolean);

      const html = `
        <div class="flex justify-between items-center pb-2 border-b border-gray-500/20">
          <h3 class="font-bold text-base">Anteprima Import CSV</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
        </div>
        <div class="space-y-3 text-xs pt-3">
          <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
            <p class="font-bold text-emerald-500">➕ ${additions.length} libri verranno aggiunti</p>
            ${exampleAdds.length > 0 ? `<ul class="mt-1 opacity-70 list-disc pl-4">${exampleAdds.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
          </div>
          <div class="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20">
            <p class="font-bold text-indigo-400">🔄 ${updates.length} libri verranno aggiornati</p>
            ${exampleUpdates.length > 0 ? `<ul class="mt-1 opacity-70 list-disc pl-4">${exampleUpdates.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
          </div>
        </div>
        <div class="flex gap-2 pt-3">
          <button onclick="closeModal()" class="flex-1 ui-btn-sec py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
          <button onclick="confirmCSVImport()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Conferma Import</button>
        </div>
      `;
      openModal(html);
    }

    async function confirmCSVImport() {
      const { additions, updates, availableFields, headersLower } = pendingCSVImport;

      function buildFieldsFromRow(row) {
        const obj = {};
        availableFields.forEach(f => {
          const idx = getCSVColumnIndex(f, headersLower);
          if (idx !== -1 && row[idx] !== undefined && row[idx] !== '') {
            obj[f.key] = row[idx].trim();
          }
        });
        return obj;
      }

      for (const add of additions) {
        const fields = buildFieldsFromRow(add.row);
        const newBook = {
          id: 'book_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          title: fields.title || '(Senza titolo)',
          author: fields.author || '',
          publisher: fields.publisher || '',
          publishYear: fields.publishYear || '',
          isbn: fields.isbn || '',
          format: fields.format || 'Fisico',
          totalPages: 0, currentPage: 0, status: 'TO_READ', wishlist: 'NONE',
          seriesName: '', seriesVol: '', rating: 0, coverUrl: '', genres: [], collections: [],
          startDate: null, endDate: null, info: '', updatedAt: new Date().toISOString()
        };
        await dbSave('books', newBook);
      }

      for (const upd of updates) {
        const fields = buildFieldsFromRow(upd.row);
        const updatedBook = { ...upd.match, ...fields, updatedAt: new Date().toISOString() };
        await dbSave('books', updatedBook);
      }

      showToast(`Import completato: ${additions.length} aggiunti, ${updates.length} aggiornati`);
      pendingCSVImport = null;
      closeModal();
      render();
    }

    function generateBookUniqueKey(b) {
      const author = (b.author || '').trim().toLowerCase();
      const title = (b.title || '').trim().toLowerCase();
      const publisher = (b.publisher || '').trim().toLowerCase();
      const year = b.publishYear ? String(b.publishYear).trim() : '';
      const format = (b.format || '').trim().toLowerCase();
      const isbn = (b.isbn || '').trim().toLowerCase();
      return `${isbn}|${author}|${title}|${publisher}|${year}|${format}`;
    }

    function generateMediaUniqueKey(m) {
      const title = (m.title || '').trim().toLowerCase();
      const creator = (m.creator || '').trim().toLowerCase();
      const type = (m.type || '').trim().toLowerCase();
      const platform = (m.platform || '').trim().toLowerCase();
      return `${type}|${title}|${creator}|${platform}`;
    }

    // Logica di merge condivisa fra "Importa Backup JSON" e la Sincronizzazione Google Drive:
    // nessun record esistente viene cancellato, solo aggiunto o aggiornato. Estratta qui in modo
    // che entrambi i percorsi si comportino sempre allo stesso modo (una sola versione da mantenere).
    // ATTENZIONE (stessa logica di prima, solo resa esplicita): questo merge è additivo, quindi
    // un elemento CANCELLATO su un dispositivo può ricomparire dopo una sync/importazione da un
    // altro dispositivo che lo aveva ancora. Non è un vero motore di sync con propagazione delle
    // cancellazioni: per rimuoverlo ovunque, cancellalo su ogni dispositivo dopo la sync.
    async function mergeBackupDataIntoDB(data) {
      if (!data || typeof data !== 'object') {
        throw new Error('Dati di backup non validi');
      }

      // Store con merge "per id": nessun record esistente viene cancellato.
      // I record importati vengono aggiunti (id nuovo) o sovrascrivono quello esistente
      // con lo stesso id (stesso record già sincronizzato in precedenza).
      const storesToMerge = ['settings', 'calendar_events', 'board_notes', 'reading_logs', 'custom_genres', 'media_logs', 'custom_collections'];
      for (const store of storesToMerge) {
        if (Array.isArray(data[store])) {
          for (const item of data[store]) {
            if (store === 'settings') {
              // Le impostazioni arrivano da un altro dispositivo/backup: non sovrascriviamo mai
              // la connessione Google Drive locale (client id/file id/token) con quella importata,
              // altrimenti due dispositivi finirebbero per "litigarsi" la propria configurazione
              // di sync ad ogni giro. Tutto il resto (tema, obiettivi, ecc.) viene comunque unito.
              const { gdriveClientId, gdriveFileId, gdriveConnected, gdriveAutoSync, gdriveLastSync, webdavPassword, ...restSettings } = item;
              await dbSave(store, { ...appSettings, ...restSettings, id: 'config' });
            } else {
              await dbSave(store, item);
            }
          }
        }
      }

      // Store con merge "per chiave di contenuto": dedup naturale, utile quando lo stesso
      // libro/media è stato catalogato indipendentemente su più dispositivi con id diversi.
      if (Array.isArray(data.books)) {
        const existingBooks = await dbGetAll('books');
        const bookMap = new Map();
        existingBooks.forEach(b => bookMap.set(generateBookUniqueKey(b), b));

        for (const importedBook of data.books) {
          const importedKey = generateBookUniqueKey(importedBook);
          if (bookMap.has(importedKey)) {
            const existingBook = bookMap.get(importedKey);
            await dbSave('books', { ...existingBook, ...importedBook, id: existingBook.id });
          } else {
            await dbSave('books', importedBook);
          }
        }
      }

      if (Array.isArray(data.media_items)) {
        const existingMedia = await dbGetAll('media_items');
        const mediaMap = new Map();
        existingMedia.forEach(m => mediaMap.set(generateMediaUniqueKey(m), m));

        for (const importedMedia of data.media_items) {
          const importedKey = generateMediaUniqueKey(importedMedia);
          if (mediaMap.has(importedKey)) {
            const existingItem = mediaMap.get(importedKey);
            await dbSave('media_items', { ...existingItem, ...importedMedia, id: existingItem.id });
          } else {
            await dbSave('media_items', importedMedia);
          }
        }
      }

      await loadSettings();
    }

    // --- SINCRONIZZAZIONE GOOGLE DRIVE ---
    // Salva un unico file JSON (stesso formato del Backup JSON) nel Drive personale dell'utente,
    // usando lo scope "drive.file": l'app può vedere/gestire SOLO il file che crea lei stessa,
    // non l'intero Drive. Richiede che l'utente crei un proprio OAuth Client ID (gratuito) su
    // Google Cloud Console e lo incolli in Opzioni — istruzioni fornite in chat.
    const GDRIVE_SYNC_FILE_NAME = 'omnishelf_sync_backup.json';
    const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

    let gdriveAccessToken = null;
    let gdriveAccessTokenExpiry = 0;
    let gdriveTokenClient = null;
    let gdriveSyncInProgress = false;

    function gdriveWaitForScript(timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        const start = Date.now();
        (function check() {
          if (window.google && window.google.accounts && window.google.accounts.oauth2) {
            resolve();
          } else if (Date.now() - start > timeoutMs) {
            reject(new Error('Google Identity Services non disponibile (offline o bloccato?)'));
          } else {
            setTimeout(check, 150);
          }
        })();
      });
    }

    // Ottiene un access token valido. interactive=true mostra il popup di consenso Google se serve
    // (va chiamato solo in risposta diretta a un click utente, per non farlo bloccare dal browser).
    // interactive=false tenta un rinnovo silenzioso (funziona solo se l'utente ha già autorizzato
    // l'app in precedenza in questo browser); se fallisce, si rifiuta senza mostrare popup.
    async function gdriveGetAccessToken(interactive) {
      if (!appSettings.gdriveClientId) throw new Error('Client ID Google mancante nelle Opzioni');
      await gdriveWaitForScript();

      if (gdriveAccessToken && Date.now() < gdriveAccessTokenExpiry - 60000) {
        return gdriveAccessToken;
      }

      return new Promise((resolve, reject) => {
        try {
          gdriveTokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: appSettings.gdriveClientId,
            scope: GDRIVE_SCOPE,
            callback: (resp) => {
              if (resp.error) { reject(new Error(resp.error)); return; }
              gdriveAccessToken = resp.access_token;
              gdriveAccessTokenExpiry = Date.now() + ((resp.expires_in || 3600) * 1000);
              resolve(gdriveAccessToken);
            },
            error_callback: (err) => reject(new Error(err && err.type ? err.type : 'Autenticazione Google annullata o fallita'))
          });
          gdriveTokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
        } catch (e) {
          reject(e);
        }
      });
    }

    async function gdriveFindFileId(token) {
      const q = encodeURIComponent(`name='${GDRIVE_SYNC_FILE_NAME}' and trashed=false`);
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Ricerca file su Drive fallita (HTTP ' + res.status + ')');
      const data = await res.json();
      return (data.files && data.files.length > 0) ? data.files[0].id : null;
    }

    async function gdriveDownloadFile(token, fileId) {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Download da Drive fallito (HTTP ' + res.status + ')');
      return await res.json();
    }

    // Crea il file al primo utilizzo, oppure lo aggiorna (PATCH) alle volte successive.
    async function gdriveUploadFile(token, fileId, jsonStr) {
      const metadata = { name: GDRIVE_SYNC_FILE_NAME, mimeType: 'application/json' };
      const boundary = 'omnishelf_' + Date.now();
      const multipartBody =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${jsonStr}\r\n` +
        `--${boundary}--`;

      const url = fileId
        ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
        : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

      const res = await fetch(url, {
        method: fileId ? 'PATCH' : 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
        body: multipartBody
      });
      if (!res.ok) throw new Error('Caricamento su Drive fallito (HTTP ' + res.status + ')');
      return await res.json();
    }

    // Collega l'app al Drive dell'utente (click esplicito -> mostra il consenso Google).
    async function gdriveConnect() {
      SoundFX.playTap();
      if (!appSettings.gdriveClientId) {
        showToast("Incolla prima il Client ID Google nelle Opzioni");
        return;
      }
      try {
        showToast("Apertura login Google...");
        const token = await gdriveGetAccessToken(true);
        let fileId = await gdriveFindFileId(token);
        if (!fileId) {
          const created = await gdriveUploadFile(token, null, JSON.stringify(await buildLocalBackupObject()));
          fileId = created.id;
        }
        appSettings.gdriveFileId = fileId;
        appSettings.gdriveConnected = true;
        appSettings.gdriveLastSync = new Date().toISOString();
        appSettings.gdriveLastError = '';
        await dbSave('settings', appSettings);
        updateGdriveSyncStatusIcon();
        showToast("Google Drive collegato!");
        render();
      } catch (e) {
        console.error("Errore connessione Google Drive:", e);
        showToast("Connessione Drive fallita: " + (e.message || 'controlla il Client ID'));
      }
    }

    async function gdriveDisconnect() {
      SoundFX.playTap();
      gdriveAccessToken = null;
      gdriveAccessTokenExpiry = 0;
      appSettings.gdriveConnected = false;
      await dbSave('settings', appSettings);
      updateGdriveSyncStatusIcon();
      showToast("Google Drive scollegato (il file resta comunque sul tuo Drive)");

    // Sync completa: scarica il file remoto e lo unisce ai dati locali (come l'import JSON),
    // poi ricarica il file remoto con lo stato locale ora aggiornato. interactive controlla se
    // mostrare o meno il popup di login quando serve un nuovo token.
    async function gdriveSyncNow(interactive) {
      if (gdriveSyncInProgress) return;
      if (!appSettings.gdriveConnected || !appSettings.gdriveClientId) {
        if (interactive) showToast("Collega prima Google Drive nelle Opzioni");
        return;
      }
      gdriveSyncInProgress = true;
      try {
        if (interactive) { SoundFX.playTap(); showToast("Sincronizzazione con Google Drive..."); }
        const token = await gdriveGetAccessToken(interactive);

        let fileId = appSettings.gdriveFileId || await gdriveFindFileId(token);
        if (fileId) {
          const remoteData = await gdriveDownloadFile(token, fileId);
          await mergeBackupDataIntoDB(remoteData);
        }

        const merged = await buildLocalBackupObject();
        const uploadResult = await gdriveUploadFile(token, fileId, JSON.stringify(merged));
        fileId = uploadResult.id || fileId;

        appSettings.gdriveFileId = fileId;
        appSettings.gdriveLastSync = new Date().toISOString();
        appSettings.gdriveLastError = '';
        await dbSave('settings', appSettings);
        updateGdriveSyncStatusIcon();

        if (interactive) showToast("Sincronizzazione completata!");
        render();
      } catch (e) {
        console.error("Errore sincronizzazione Google Drive:", e);
        if (interactive) showToast("Sync Drive fallita: " + (e.message || 'riprova'));
        // In modalità silenziosa (avvio app) non mostriamo un popup (per non interrompere
        // l'utente ogni volta che il token scade), ma salviamo comunque l'errore così resta
        // visibile in Opzioni finché non si risolve o non si ritenta con successo, e accendiamo
        // il simbolo 🚫 accanto alla lente di ricerca per renderlo visibile subito anche fuori
        // dalle Opzioni.
        appSettings.gdriveLastError = (e.message || 'Errore sconosciuto') + ' — ' + new Date().toLocaleString('it-IT');
        await dbSave('settings', appSettings);
        updateGdriveSyncStatusIcon();
        render();
      } finally {
        gdriveSyncInProgress = false;
      }
    }

    // --- MEDIA LOG FUNCTIONS ---
    // Calcola stato di fruizione e date (inizio/fine) in base alla percentuale impostata.
    // Stessa filosofia di computeReadingStateFromPercent, ma con le etichette di stato dei media.
    function computeMediaStateFromPercent(percent, existingStartDate, existingEndDate) {
      const today = getLocalDateString();
      let status, startDate = existingStartDate || '', endDate = existingEndDate || '';

      if (percent <= 0) {
        status = 'TO_START';
      } else if (percent < 100) {
        status = 'IN_PROGRESS';
        if (!startDate) startDate = today;
      } else {
        status = 'COMPLETED';
        if (!endDate) endDate = today;
      }

      return { status, startDate, endDate };
    }

    async function updateMediaPercentQuick(mediaId, percentValue, e) {
      if (e) e.stopPropagation();
      SoundFX.playTap();

      let percent = parseInt(percentValue);
      if (isNaN(percent)) { render(); return; }
      percent = Math.max(0, Math.min(100, percent));

      const items = await dbGetAll('media_items');
      const item = items.find(m => m.id === mediaId);
      if (!item) return;

      const totalUnits = item.totalUnits || 0;
      const oldVal = item.currentUnit || 0;
      const newVal = totalUnits > 0 ? Math.round((percent / 100) * totalUnits) : oldVal;

      const { status, startDate, endDate } = computeMediaStateFromPercent(percent, item.startDate, item.endDate);

      item.currentUnit = newVal;
      item.status = status;
      item.startDate = startDate || null;
      item.endDate = endDate || null;
      const unitsChanged = newVal - oldVal;
      if (unitsChanged !== 0) item.lastActivityAt = new Date().toISOString();

      await dbSave('media_items', item);
      if (unitsChanged > 0) {
        await recordMediaLog(mediaId, unitsChanged, newVal);
      }
      render();
    }

                        ${item.isAllDay || item.time ? `<span class="text-[10px] font-bold ui-accent-text bg-indigo-500/10 px-1.5 py-0.5 rounded whitespace-nowrap">${item.isAllDay ? 'Tutto il giorno' : (item.time + (item.endTime ? '–' + item.endTime : ''))}</span>` : ''}

                      <div class="space-y-1 relative z-10 pr-14">

                          <span>${item.icon || '📌'}${showPhotoIcon ? ' 📷' : ''}</span>

                        </div>
                        ${item.description ? `<p class="text-[11px] opacity-70">${item.description}</p>` : ''}
                        ${linkedBook ? `<p class="text-[10px] ui-accent-text">📖 ${linkedBook.title}</p>` : ''}
                        ${linkedMediaForEvent ? `<p class="text-[10px] ui-accent-text">🎬 ${linkedMediaForEvent.title}</p>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}

                ${dayActivity.notes.map(item => {
                  const linkedBookForNote = books.find(b => b.id === item.linkedBookId);
                  const linkedMediaForNote = mediaItems.find(m => m.id === item.linkedMediaId);
                  const bgImage = getItemBackgroundImage(item, books, mediaItems);
                  const showBgLayer = bgImage && appSettings.photoDisplayMode !== 'ICON';
                  const showPhotoIcon = bgImage && appSettings.photoDisplayMode === 'ICON';

                  return `

                      <div class="absolute top-2 right-2 z-10">
                        <span class="text-[10px] font-bold text-amber-500 bg-amber-500/10 px-1.5 py-0.5 rounded whitespace-nowrap">${item.scheduledTime || 'Nota'}</span>

                      <div class="space-y-1 relative z-10 pr-12">
                        <div class="flex items-center gap-2">
                          <span>${item.icon || '📝'}${showPhotoIcon ? ' 📷' : ''}</span>

                      </div>

                  `;
                }).join('')}
              </div>
            </div>
          </div>

      else if (currentTab === 'library') {
        const allBooks = await getCachedBooks();
        
        let filtered = allBooks.filter(b => {
          if (librarySearchQuery) {
            const q = librarySearchQuery.toLowerCase();
            const matchTitle = (b.title || '').toLowerCase().includes(q);
            const matchAuthor = (b.author || '').toLowerCase().includes(q);
            const matchPublisher = (b.publisher || '').toLowerCase().includes(q);
            const matchSeries = (b.seriesName || '').toLowerCase().includes(q);
            const matchIsbn = (b.isbn || '').toLowerCase().includes(q);
            const matchInfo = (b.info || '').toLowerCase().includes(q);
            if (!matchTitle && !matchAuthor && !matchPublisher && !matchSeries && !matchIsbn && !matchInfo) return false;
          }

          if (libraryStateFilter !== 'ALL' && b.status !== libraryStateFilter) return false;
          if (libraryFormatFilter !== 'ALL' && b.format !== libraryFormatFilter) return false;

          if (libraryGenreFilter !== 'ALL') {
            if (!b.genres || !b.genres.includes(libraryGenreFilter)) return false;
          }

          if (libraryCollectionFilter !== 'ALL') {
            if (!b.collections || !b.collections.includes(libraryCollectionFilter)) return false;
          }

          if (libraryWishlistFilter !== 'ALL') {
            if (libraryWishlistFilter === 'NO') {
              if (b.wishlist && b.wishlist !== 'NONE') return false;
            } else if (b.wishlist !== libraryWishlistFilter) {
              return false;
            }
          }

          return true;
        });

        filtered.sort((a, b) => {
          if (librarySortBy === 'CREATED_DESC') return (b.id || '').localeCompare(a.id || '');

          if (librarySortBy === 'END_DATE_DESC') return (b.endDate || '').localeCompare(a.endDate || '');

          return 0;
        });

                    ${appSettings.libraryShowRealCovers ? '🖼️ Vere' : '📝 Finte'}

                  </button>
                </div>

                <option value="END_DATE_DESC" ${librarySortBy === 'END_DATE_DESC' ? 'selected' : ''}>Ordina: Ultima lettura</option>
                <option value="TITLE_ASC" ${librarySortBy === 'TITLE_ASC' ? 'selected' : ''}>Ordina: Titolo (A-Z)</option>
                <option value="RATING_DESC" ${librarySortBy === 'RATING_DESC' ? 'selected' : ''}>Ordina: Valutazione ⭐</option>
              </select>
            </div>

            <!-- FILTRI RAPIDI -->
            <div class="ui-card p-3 rounded-xl border space-y-2 text-xs">
              <div class="flex flex-wrap gap-1.5 items-center">
                <span class="font-bold opacity-60 text-[10px] uppercase tracking-wider mr-1">Stato:</span>
                ${[
                  ['ALL', 'Tutti'],
                  ['TO_READ', 'Da leggere'],
                  ['READING', 'In lettura'],
                  ['COMPLETED', 'Letto'],
                  ['PAUSED', 'Sospeso'],
                  ['DROPPED', 'Abbandonato']
                ].map(([val, label]) => `
                  <button onclick="libraryStateFilter = '${val}'; libraryCurrentPage = 1; render();" class="px-2.5 py-1 rounded-lg border transition ${libraryStateFilter === val ? 'bg-indigo-600 text-white border-indigo-600' : 'border-gray-500/30 opacity-70'}">${label}</button>
                `).join('')}
              </div>

              <div class="grid grid-cols-2 gap-2.5 pt-2.5 border-t border-gray-500/20">
                <div>
                  <label class="block font-bold opacity-60 text-[10px] uppercase mb-1">Formato</label>
                  <select onchange="libraryFormatFilter = this.value; libraryCurrentPage = 1; render();" class="ui-input w-full py-1.5 px-2 rounded-lg border text-xs">
                    <option value="ALL">Tutti</option>
                    <option value="Fisico" ${libraryFormatFilter === 'Fisico' ? 'selected' : ''}>Fisico</option>
                    <option value="E-book" ${libraryFormatFilter === 'E-book' ? 'selected' : ''}>E-book</option>
                    <option value="Audio-libro" ${libraryFormatFilter === 'Audio-libro' ? 'selected' : ''}>Audio-libro</option>
                  </select>

                  <select onchange="libraryCollectionFilter = this.value; libraryCurrentPage = 1; render();" class="ui-input w-full py-1.5 px-2 rounded-lg border text-xs">
                    <option value="ALL">Tutte</option>
                    ${availableCollections.map(c => `<option value="${c}" ${libraryCollectionFilter === c ? 'selected' : ''}>${c}</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label class="block font-bold opacity-60 text-[10px] uppercase mb-1">Wishlist</label>
                  <select onchange="libraryWishlistFilter = this.value; libraryCurrentPage = 1; render();" class="ui-input w-full py-1.5 px-2 rounded-lg border text-xs">

                    <option value="NO" ${libraryWishlistFilter === 'NO' ? 'selected' : ''}>In possesso</option>
                    <option value="EVALUATE" ${libraryWishlistFilter === 'EVALUATE' ? 'selected' : ''}>Da valutare</option>
                    <option value="TO_BUY" ${libraryWishlistFilter === 'TO_BUY' ? 'selected' : ''}>Da prendere</option>

                  <p class="text-xs mt-2">Nessun libro risponde ai criteri di ricerca o filtro.</p>

                const percent = Math.min(100, Math.round(((b.currentPage || 0) / (b.totalPages || 1)) * 100));

                else if (b.status === 'PAUSED') { statusLabel = 'Sospeso'; statusClass = 'bg-amber-500/20 text-amber-400'; }

            </div>

            ${filtered.length > ITEMS_PER_PAGE ? `
              <div class="flex items-center justify-between gap-2 pt-1">
                <button onclick="changeMediaPage(-1)" class="ui-btn-sec px-3 py-1.5 rounded-lg text-xs font-bold ${mediaCurrentPage <= 1 ? 'opacity-30 cursor-not-allowed' : ''}" ${mediaCurrentPage <= 1 ? 'disabled' : ''}>← Precedente</button>
                <span class="text-xs opacity-70 font-medium">Pagina ${mediaCurrentPage} di ${mediaTotalPages}</span>
                <button onclick="changeMediaPage(1)" class="ui-btn-sec px-3 py-1.5 rounded-lg text-xs font-bold ${mediaCurrentPage >= mediaTotalPages ? 'opacity-30 cursor-not-allowed' : ''}" ${mediaCurrentPage >= mediaTotalPages ? 'disabled' : ''}>Successiva →</button>
              </div>
